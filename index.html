  <style>
    html, body {
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeSlideUp 0.22s ease-out forwards;
    }
    /* Destaques VUNESP */
    .law-text mark {
      background-color: #fef08a;
      color: #713f12;
      padding: 0.08rem 0.28rem;
      border-radius: 0.35rem;
      font-weight: 700;
      transition: all 0.2s ease;
    }
    .dark .law-text mark {
      background-color: rgba(234, 179, 8, 0.28);
      color: #fde047;
    }
    .hide-marks .law-text mark {
      background-color: transparent !important;
      color: inherit !important;
      padding: 0 !important;
      font-weight: inherit !important;
    }
  </style>

    ];

    /* ============================================================================
       2. MOTOR DE REGEX HIERÁRQUICO DE LEI SECA (0% DE PERDA)
       ============================================================================ */
    const LawParser = {
      /**
       * Normaliza quebras de linha e espaços extras preservando estrutura de parágrafos.
       */
      normalizeText(raw) {
        return raw
          .replace(/\r\n/g, '\n')
          .replace(/\r/g, '\n')
          .replace(/\u00A0/g, ' ')
          .replace(/[ \t]+/g, ' ')
          .trim();
      },

      /**
       * Verifica se uma linha é um cabeçalho estrutural:
       * TÍTULO, CAPÍTULO, SEÇÃO ou SUBSEÇÃO (com ou sem acentos, romanos/arábicos/II-A/ÚNICO).
       */
      matchHeading(line) {
        const clean = line.trim();
        if (!clean || clean.length > 180) return null;

        const rx = /^(T[ÍI]TULO|CAP[ÍI]TULO|SUBSE[ÇC][ÃA]O|SE[ÇC][ÃA]O)\s+([IVXLCDM]+(?:-[A-Z])?|\d+(?:-[A-Z])?|[ÚU]NICO)\b(?:\s*[-–—:.]\s*(.+))?$/i;
        const m = clean.match(rx);
        if (!m) return null;

        const rawType = m[1].toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        let level = 1;
        let labelType = 'TÍTULO';
        if (rawType === 'TITULO') { level = 1; labelType = 'TÍTULO'; }
        else if (rawType === 'CAPITULO') { level = 2; labelType = 'CAPÍTULO'; }
        else if (rawType === 'SECAO') { level = 3; labelType = 'SEÇÃO'; }
        else if (rawType === 'SUBSECAO') { level = 4; labelType = 'SUBSEÇÃO'; }

        const code = `${labelType} ${m[2].toUpperCase()}`;
        const inlineSubtitle = m[3] ? m[3].trim() : '';

        return { level, labelType, code, subtitle: inlineSubtitle };
      },

      /**
       * Verifica se uma linha inicia um Artigo (Art. 1º, Art. 10., Art. 311-A, Art. 1.026).
       */
      matchArticleStart(line) {
        const clean = line.trim();
        const rx = /^(Art\.?\s*\d+(?:\.\d+)*(?:[º°o])?(?:-[A-Za-z])?\.?)\s*(?:[-–—]\s*)?(.*)$/i;
        const m = clean.match(rx);
        if (!m) return null;

        // Padroniza rótulo do artigo (ex: "Art. 1º", "Art. 311-A")
        let num = m[1].replace(/\s+/g, ' ').replace(/\.$/, '').trim();
        if (!/^Art\./i.test(num)) num = num.replace(/^Art\s*/i, 'Art. ');
        const rest = (m[2] || '').trim();
        return { numero: num, textoInicial: rest };
      },

      /**
       * Extrai 100% dos artigos respeitando rigorosamente a hierarquia TÍTULO > CAPÍTULO > SEÇÃO > SUBSEÇÃO.
       */
      parse(rawText, options = {}) {
        const splitLongSections = Boolean(options.splitLongSections);
        const maxPerChunk = options.maxPerChunk || 12;
        const defaultBlockSize = options.defaultBlockSize || 8;

        const lines = this.normalizeText(rawText).split('\n').map(l => l.trim());
        const hierarchy = { 1: null, 2: null, 3: null, 4: null };

        const rawGroups = [];
        let currentGroup = null;
        let currentArticle = null;
        let hasAnyHeading = false;

        const ensureGroup = () => {
          if (!currentGroup) {
            currentGroup = {
              breadcrumb: hasAnyHeading ? this.buildBreadcrumb(hierarchy) : 'LEI SECA',
              titulo: hasAnyHeading ? this.getActiveTitle(hierarchy) : 'Disposições Iniciais',
              artigos: []
            };
            rawGroups.push(currentGroup);
          }
        };

        const flushArticle = () => {
          if (currentArticle) {
            currentArticle.textoBruto = currentArticle.linhas.join('\n').trim();
            delete currentArticle.linhas;
            ensureGroup();
            currentGroup.artigos.push(currentArticle);
            currentArticle = null;
          }
        };

        for (let i = 0; i < lines.length; i++) {
          const line = lines[i];
          if (!line) continue;

          // 1. Verifica se é cabeçalho estrutural
          const heading = this.matchHeading(line);
          if (heading) {
            flushArticle();
            hasAnyHeading = true;

            // Captura subtítulo na linha imediatamente abaixo, se não veio na mesma linha
            if (!heading.subtitle && i + 1 < lines.length) {
              const nextLine = lines[i + 1];
              if (nextLine && !this.matchHeading(nextLine) && !this.matchArticleStart(nextLine) && nextLine.length <= 160) {
                heading.subtitle = nextLine;
                i++;
              }
            }

            // Atualiza hierarquia limpando níveis inferiores
            hierarchy[heading.level] = heading;
            for (let lvl = heading.level + 1; lvl <= 4; lvl++) {
              hierarchy[lvl] = null;
            }

            // Inicia novo grupo estrutural
            currentGroup = {
              breadcrumb: this.buildBreadcrumb(hierarchy),
              titulo: heading.subtitle || heading.code,
              artigos: []
            };
            rawGroups.push(currentGroup);
            continue;
          }

          // 2. Verifica se inicia um Artigo
          const art = this.matchArticleStart(line);
          if (art) {
            flushArticle();
            ensureGroup();
            currentArticle = {
              numero: art.numero,
              linhas: art.textoInicial ? [art.textoInicial] : []
            };
            continue;
          }

          // 3. Continuação do artigo atual (parágrafos, incisos, alíneas, texto corrido)
          if (currentArticle) {
            currentArticle.linhas.push(line);
          }
        }
        flushArticle();

        // Remove grupos vazios (ex: TÍTULO seguido imediatamente de CAPÍTULO sem artigos no meio)
        const nonEmptyGroups = rawGroups.filter(g => g.artigos.length > 0);

        // Constrói trilhas finais garantindo 100% dos artigos mapeados
        const trilhas = [];
        let totalArticlesDetected = 0;

        nonEmptyGroups.forEach((group, gIdx) => {
          totalArticlesDetected += group.artigos.length;

          // Caso 1: Documento sem nenhum cabeçalho estrutural -> fatiar em blocos configuráveis (padrão 8)
          if (!hasAnyHeading) {
            for (let start = 0; start < group.artigos.length; start += defaultBlockSize) {
              const slice = group.artigos.slice(start, start + defaultBlockSize);
              const partNum = Math.floor(start / defaultBlockSize) + 1;
              trilhas.push(this.buildTrilhaObject(
                `imp_${Date.now()}_${gIdx}_${partNum}`,
                `BLOCO ${partNum}`,
                `Lei Seca — Parte ${partNum}`,
                slice
              ));
            }
            return;
          }

          // Caso 2: Switch opcional "Dividir seções muito longas (>12 artigos)"
          if (splitLongSections && group.artigos.length > maxPerChunk) {
            const totalParts = Math.ceil(group.artigos.length / maxPerChunk);
            for (let start = 0; start < group.artigos.length; start += maxPerChunk) {
              const slice = group.artigos.slice(start, start + maxPerChunk);
              const partNum = Math.floor(start / maxPerChunk) + 1;
              trilhas.push(this.buildTrilhaObject(
                `imp_${Date.now()}_${gIdx}_${partNum}`,
                group.breadcrumb,
                `${group.titulo} (Parte ${partNum}/${totalParts})`,
                slice
              ));
            }
            return;
          }

          // Caso 3 (Padrão): Respeita integralmente o limite de cada TÍTULO/CAPÍTULO/SEÇÃO/SUBSEÇÃO
          trilhas.push(this.buildTrilhaObject(
            `imp_${Date.now()}_${gIdx}`,
            group.breadcrumb,
            group.titulo,
            group.artigos
          ));
        });

        const totalArticlesMapped = trilhas.reduce((acc, t) => acc + t.artigos.length, 0);

        return {
          trilhas,
          audit: {
            totalArticlesDetected,
            totalArticlesMapped,
            totalTrilhas: trilhas.length,
            hasAnyHeading,
            coveragePercent: totalArticlesDetected > 0 ? Math.round((totalArticlesMapped / totalArticlesDetected) * 100) : 0
          }
        };
      },

      buildBreadcrumb(hierarchy) {
        return [1, 2, 3, 4]
          .map(lvl => hierarchy[lvl] ? hierarchy[lvl].code : null)
          .filter(Boolean)
          .join(' › ');
      },

      getActiveTitle(hierarchy) {
        for (let lvl = 4; lvl >= 1; lvl--) {
          if (hierarchy[lvl]) return hierarchy[lvl].subtitle || hierarchy[lvl].code;
        }
        return 'Disposições Iniciais';
      },

      buildTrilhaObject(id, breadcrumb, titulo, artigosSlice) {
        const firstArt = artigosSlice[0]?.numero || '';
        const lastArt = artigosSlice[artigosSlice.length - 1]?.numero || '';
        const count = artigosSlice.length;
        const rangeText = count === 1 ? `${firstArt} • 1 artigo` : `${firstArt} ao ${lastArt} • ${count} artigos`;
        const tempoLeituraMin = count <= 8 ? 5 : 10;

        return {
          id,
          breadcrumb,
          titulo,
          subtitulo: rangeText,
          tempoLeituraMin,
          selected: true,
          artigos: artigosSlice.map(a => ({
            numero: a.numero,
            textoBruto: a.textoBruto,
            textoHtml: OfflineGenerator.highlightVunesp(a.textoBruto)
          })),
          questoes: []
        };
      },

      /**
       * Formata o texto de um artigo separando visualmente caput, Parágrafo único, §§, incisos e alíneas.
       */
      formatArticleBlocks(textoHtml) {
        if (!textoHtml) return '';
        // Quebra linhas explícitas e também insere quebras antes de marcadores clássicos caso venham inline
        const prepared = textoHtml
          .replace(/\s+(?=(?:Parágrafo\s+único|§\s*\d+[º°]?)\b)/gi, '\n')
          .replace(/\s+(?=[IVXLCDM]+\s*[-–—]\s)/g, '\n')
          .replace(/\s+(?=[a-z]\)\s)/g, '\n');

        const lines = prepared.split('\n').map(l => l.trim()).filter(Boolean);

        return lines.map((line, idx) => {
          if (idx === 0) {
            return `<p class="text-slate-800 dark:text-slate-100 leading-relaxed font-normal">${line}</p>`;
          }
          if (/^(Parágrafo\s+único|§\s*\d+[º°]?)/i.test(line)) {
            return `<p class="mt-2.5 pl-3 border-l-2 border-indigo-300 dark:border-indigo-700 text-slate-700 dark:text-slate-200 leading-relaxed">${line}</p>`;
          }
          if (/^[IVXLCDM]+\s*[-–—]/i.test(line)) {
            return `<p class="mt-1.5 pl-5 text-slate-700 dark:text-slate-200 leading-relaxed">${line}</p>`;
          }
          if (/^[a-z]\)\s/i.test(line)) {
            return `<p class="mt-1 pl-9 text-slate-600 dark:text-slate-300 leading-relaxed">${line}</p>`;
          }
          return `<p class="mt-2 text-slate-700 dark:text-slate-200 leading-relaxed">${line}</p>`;
        }).join('');
      }
    };

    /* ============================================================================
       3. GERADOR OFFLINE E INTEGRAÇÃO OPCIONAL COM API GEMINI (gemini-2.5-flash)
       ============================================================================ */
    const OfflineGenerator = {
      highlightVunesp(text) {
        const escaped = text
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');

        const rx = /\b(\d+\s*(?:\([^)]+\)\s*)?(?:dias?|meses?|mês|anos?|horas?|minutos?|por cento|%)|salvo|exceto|vedad[oa]s?|proibid[oa]s?|obrigatóri[oa]s?|facultativ[oa]s?|reclusão|detenção|extingue a punibilidade|sem prejuízo|improrrogável|prorrogável|exclusivamente|unicamente)\b/gi;
        return escaped.replace(rx, '<mark>$1</mark>');
      },

      generateQuestionsForTrilha(trilha) {
        const questions = [];
        const artigos = trilha.artigos;
        const swapPairs = [
          ['vedado', 'permitido'], ['proibido', 'permitido'], ['obrigatório', 'facultativo'],
          ['facultativo', 'obrigatório'], ['reclusão', 'detenção'], ['detenção', 'reclusão'],
          ['salvo', 'inclusive'], ['exceto', 'inclusive'], ['sem prejuízo', 'com prejuízo']
        ];

        artigos.slice(0, 6).forEach((art, idx) => {
          const cleanText = (art.textoBruto || art.textoHtml.replace(/<[^>]+>/g, '')).replace(/\s+/g, ' ').trim();
          const shortSnippet = cleanText.length > 220 ? cleanText.slice(0, 220).trim() + '...' : cleanText;

          // 1. Tenta Cloze em prazo ou palavra-chave
          const keyMatch = shortSnippet.match(/\b(\d+\s*(?:dias?|meses?|anos?)|vedado|proibido|obrigatório|facultativo|reclusão|detenção|salvo|exceto)\b/i);
          if (keyMatch && idx % 2 === 0) {
            const target = keyMatch[1];
            const enunciado = shortSnippet.replace(target, '_____');
            let distractors = ['vedado', 'facultativo', 'obrigatório', 'exceto'];
            if (/\d+/.test(target)) {
              const num = parseInt(target, 10);
              const unit = target.replace(/\d+\s*/, '');
              distractors = [
                `${Math.max(1, num - 5)} ${unit}`,
                `${num + 5} ${unit}`,
                `${num * 2} ${unit}`
              ];
            }
            const opcoes = Array.from(new Set([target, ...distractors])).slice(0, 4).sort(() => Math.random() - 0.5);
            questions.push({
              id: `${trilha.id}_off_q${idx + 1}`,
              tipo: 'cloze',
              artigoRef: art.numero,
              enunciado: `(${art.numero}) ${enunciado}`,
              opcoes,
              respostaCorreta: target,
              textoLiteral: `${art.numero} - ${art.textoHtml}`,
              dicaVunesp: 'Atenção à literalidade de prazos e palavras-chave cobradas pela VUNESP.'
            });
            return;
          }

          // 2. Certo ou Errado (com troca sutil quando possível)
          let statement = shortSnippet;
          let isTrue = true;
          for (const [a, b] of swapPairs) {
            const r = new RegExp(`\\b${a}\\b`, 'i');
            if (r.test(statement)) {
              statement = statement.replace(r, b);
              isTrue = false;
              break;
            }
          }
          questions.push({
            id: `${trilha.id}_off_q${idx + 1}`,
            tipo: 'true_false',
            artigoRef: art.numero,
            enunciado: `Segundo o ${art.numero}: "${statement}"`,
            respostaCorreta: isTrue,
            textoLiteral: `${art.numero} - ${art.textoHtml}`,
            dicaVunesp: isTrue
              ? 'Redação fiel à lei seca. Memorize os termos destacados.'
              : 'Pegadinha clássica: a banca inverteu um termo restritivo/permissivo do artigo.'
          });
        });

        return questions;
      }
    };

    const GeminiGenerator = {
      async generateForTrilha(trilha, apiKey) {
        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(apiKey)}`;
        const articlesText = trilha.artigos.map(a => `${a.numero} - ${a.textoBruto || a.textoHtml.replace(/<[^>]+>/g, '')}`).join('\n\n');

        const prompt = `Atue como especialista na banca VUNESP (Escrevente TJSP).
Com base EXCLUSIVAMENTE nos artigos abaixo, gere um JSON válido (sem markdown, apenas o objeto JSON) contendo um array "questoes" com 3 a 6 questões distribuídas entre "true_false", "cloze" e "multiple_choice".
Formato obrigatório:
{
  "questoes": [
    {
      "id": "${trilha.id}_q1",
      "tipo": "true_false",
      "artigoRef": "Art. X",
      "enunciado": "Afirmação para julgar",
      "respostaCorreta": false,
      "textoLiteral": "Art. X - texto com <mark>destaque</mark>",
      "dicaVunesp": "Explicação curta"
    },
    {
      "id": "${trilha.id}_q2",
      "tipo": "cloze",
      "artigoRef": "Art. Y",
      "enunciado": "Frase com _____ oculta",
      "opcoes": ["op1", "op2", "op3", "op4"],
      "respostaCorreta": "op1",
      "textoLiteral": "Art. Y - texto com <mark>op1</mark>",
      "dicaVunesp": "Explicação curta"
    },
    {
      "id": "${trilha.id}_q3",
      "tipo": "multiple_choice",
      "artigoRef": "Art. Z",
      "enunciado": "Pergunta objetiva?",
      "opcoes": ["A", "B", "C", "D"],
      "respostaCorreta": 0,
      "textoLiteral": "Art. Z - texto com <mark>destaque</mark>",
      "dicaVunesp": "Explicação curta"
    }
  ]
}

ARTIGOS:
${articlesText}`;

        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }],
            generationConfig: { responseMimeType: 'application/json', temperature: 0.3 }
          })
        });

        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const rawText = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
        const cleaned = rawText.replace(/^```json\s*/i, '').replace(/```$/i, '').trim();
        const parsed = JSON.parse(cleaned);
        if (!Array.isArray(parsed.questoes) || parsed.questoes.length === 0) {
          throw new Error('JSON sem questões válidas');
        }
        return parsed.questoes;
      }
    };

    /* ============================================================================
       4. ESTADO GLOBAL E PERSISTÊNCIA (LOCALSTORAGE)
       ============================================================================ */
    const StateStore = {
      state: null,
      customTrilhas: {},

      defaultState() {
        return {
          theme: 'light',
          activeTab: 'trilhas',
          selectedDisciplinaId: 'penal',
          xp: 0,
          streak: 0,
          lastStudyDate: null,
          simOffsetDays: 0,
          fontSize: 15,
          showMarks: true,
          completedTrilhas: {}, // { [trilhaId]: { completedAt, bestScore: 100 } }
          srs: {},              // { [questionId]: { nextReview, interval, ease, reps, disciplinaId, trilhaId } }
          errorBook: {}         // { [questionId]: { count, lastWrong, disciplinaId, trilhaId } }
        };
      },

      load() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEYS.STATE) || 'null');
          this.state = { ...this.defaultState(), ...(saved || {}) };
        } catch {
          this.state = this.defaultState();
        }
        try {
          this.customTrilhas = JSON.parse(localStorage.getItem(STORAGE_KEYS.CUSTOM_TRILHAS) || '{}');
        } catch {
          this.customTrilhas = {};
        }
      },

      save() {
        localStorage.setItem(STORAGE_KEYS.STATE, JSON.stringify(this.state));
        localStorage.setItem(STORAGE_KEYS.CUSTOM_TRILHAS, JSON.stringify(this.customTrilhas));
      },

      getTodayKey() {
        const d = new Date();
        d.setDate(d.getDate() + (this.state.simOffsetDays || 0));
        return d.toISOString().slice(0, 10);
      },

      addDaysToKey(baseKey, days) {
        const d = new Date(baseKey + 'T12:00:00');
        d.setDate(d.getDate() + days);
        return d.toISOString().slice(0, 10);
      },

      getAllDisciplinas() {
        return BASE_DISCIPLINAS.map(disc => ({
          ...disc,
          trilhas: [...disc.trilhas, ...(this.customTrilhas[disc.id] || [])]
        }));
      },

      findQuestionById(qId) {
        for (const d of this.getAllDisciplinas()) {
          for (const t of d.trilhas) {
            const q = (t.questoes || []).find(item => item.id === qId);
            if (q) return { question: q, trilha: t, disciplina: d };
          }
        }
        return null;
      },

      registerStudyActivity(xpGain = 10) {
        const today = this.getTodayKey();
        if (this.state.lastStudyDate !== today) {
          const yesterday = this.addDaysToKey(today, -1);
          this.state.streak = this.state.lastStudyDate === yesterday ? this.state.streak + 1 : 1;
          this.state.lastStudyDate = today;
        }
        this.state.xp += xpGain;
        this.save();
      },

      scheduleSrs(qId, rating, meta = {}) {
        const today = this.getTodayKey();
        const prev = this.state.srs[qId] || { interval: 0, ease: 2.5, reps: 0 };
        let interval = 1;
        let ease = prev.ease;
        let reps = prev.reps;

        if (rating === 'again') { interval = 0; reps = 0; ease = Math.max(1.3, ease - 0.2); }
        else if (rating === 'hard') { interval = 1; reps += 1; ease = Math.max(1.3, ease - 0.15); }
        else if (rating === 'good') { interval = reps === 0 ? 3 : Math.round(Math.max(3, prev.interval * ease)); reps += 1; }
        else if (rating === 'easy') { interval = reps === 0 ? 7 : Math.round(Math.max(7, prev.interval * ease * 1.3)); reps += 1; ease += 0.15; }

        this.state.srs[qId] = {
          nextReview: this.addDaysToKey(today, interval),
          interval,
          ease,
          reps,
          disciplinaId: meta.disciplinaId || prev.disciplinaId,
          trilhaId: meta.trilhaId || prev.trilhaId
        };
        this.save();
      },

      getDueReviews() {
        const today = this.getTodayKey();
        const list = [];
        Object.entries(this.state.srs).forEach(([qId, info]) => {
          if (info.nextReview <= today) {
            const found = this.findQuestionById(qId);
            if (found) list.push({ ...found, srs: info });
          }
        });
        return list;
      }
    };

    const ImportController = {

      async handleFileUpload(event) {
        const file = event.target.files?.[0];
        if (!file) return;
        this.fileName = file.name;

        try {
          if (file.name.toLowerCase().endsWith('.docx')) {
            const arrayBuffer = await file.arrayBuffer();
            const result = await mammoth.extractRawText({ arrayBuffer });
            this.rawText = result.value || '';
          } else {
            this.rawText = await file.text();
          }
          this.runParse();
          UI.toast(`Arquivo "${file.name}" lido com sucesso!`, '📄');
        } catch (err) {
          UI.toast('Erro ao ler o arquivo. Tente novamente ou cole o texto.', '⚠️');
        }
      },

      handlePasteParse() {
        const textarea = document.getElementById('import-paste-area');
        if (!textarea || !textarea.value.trim()) {
          UI.toast('Cole o texto literal da lei primeiro.', '⚠️');
          return;
        }
        this.fileName = 'Texto colado manualmente';
        this.rawText = textarea.value;
        this.runParse();
      },

      toggleSplitLong(checked) {
        this.splitLongSections = checked;
        if (this.rawText) this.runParse();
      },

      updateBlockSize(val) {
        this.defaultBlockSize = Math.max(3, Math.min(20, parseInt(val, 10) || 8));
        if (this.rawText) this.runParse();
      },

      runParse() {
        this.parsedResult = LawParser.parse(this.rawText, {
          splitLongSections: this.splitLongSections,
          maxPerChunk: 12,
          defaultBlockSize: this.defaultBlockSize
        });
        AppController.render();
      },

      toggleTrilhaSelection(idx) {
        if (!this.parsedResult?.trilhas[idx]) return;
        this.parsedResult.trilhas[idx].selected = !this.parsedResult.trilhas[idx].selected;
        AppController.render();
      },

      async saveImportedTrilhas(mode) {
        if (!this.parsedResult || this.isGenerating) return;
        const chosen = this.parsedResult.trilhas.filter(t => t.selected);
        if (chosen.length === 0) {
          UI.toast('Selecione pelo menos 1 trilha para importar.', '⚠️');
          return;
        }

        const apiKey = localStorage.getItem(STORAGE_KEYS.GEMINI_KEY) || '';
        const useGemini = mode === 'gemini' && apiKey.trim().length > 10;

        this.isGenerating = true;
        const statusBox = document.getElementById('import-progress-box');
        const statusText = document.getElementById('import-progress-text');
        const statusBar = document.getElementById('import-progress-bar');
        if (statusBox) statusBox.classList.remove('hidden');

        const discId = this.selectedDisciplinaId;
        if (!StateStore.customTrilhas[discId]) StateStore.customTrilhas[discId] = [];

        let fallbackCount = 0;

        for (let i = 0; i < chosen.length; i++) {
          const trilha = { ...chosen[i] };
          delete trilha.selected;

          if (statusText) statusText.textContent = `Processando trilha ${i + 1} de ${chosen.length}: ${trilha.titulo}`;
          if (statusBar) statusBar.style.width = `${Math.round(((i + 1) / chosen.length) * 100)}%`;

          if (useGemini) {
            try {
              trilha.questoes = await GeminiGenerator.generateForTrilha(trilha, apiKey);
            } catch {
              fallbackCount++;
              trilha.questoes = OfflineGenerator.generateQuestionsForTrilha(trilha);
            }
          } else {
            trilha.questoes = OfflineGenerator.generateQuestionsForTrilha(trilha);
          }

          StateStore.customTrilhas[discId].push(trilha);
        }

        StateStore.save();
        this.isGenerating = false;
        this.resetPreview();
        StateStore.state.selectedDisciplinaId = discId;
        AppController.switchTab('trilhas');

        if (fallbackCount > 0) {
          UI.toast(`${chosen.length} trilhas salvas (${fallbackCount} em modo offline por limite/erro na API).`, '⚡');
        } else {
          UI.toast(`${chosen.length} trilhas importadas com 100% dos artigos!`, '🎉');
        }
      },

      deleteCustomTrilha(discId, trilhaId) {
        UI.confirm('Excluir trilha importada?', 'Os artigos e questões desta trilha serão removidos do seu dispositivo.', () => {
          StateStore.customTrilhas[discId] = (StateStore.customTrilhas[discId] || []).filter(t => t.id !== trilhaId);
          StateStore.save();
          AppController.render();
          UI.toast('Trilha removida.', '🗑️');
        });
      }
    };

    const PlayerController = {
      active: false,
      mode: null, // 'reading' | 'game' | 'srs'
      disciplina: null,
      trilha: null,
      timerSeconds: 0,
      timerInterval: null,
      timerRunning: false,
      questions: [],
      qIndex: 0,
      correctCount: 0,
      answered: false,
      lastCorrect: false,

      startTrilha(disciplinaId, trilhaId) {
        const disc = StateStore.getAllDisciplinas().find(d => d.id === disciplinaId);
        const trilha = disc?.trilhas.find(t => t.id === trilhaId);
        if (!disc || !trilha) return;

        this.active = true;
        this.mode = 'reading';
        this.disciplina = disc;
        this.trilha = trilha;
        this.timerSeconds = (trilha.tempoLeituraMin || 5) * 60;
        this.timerRunning = false;
        this.stopTimer();

        AppController.render();
      },

      startGamePhase() {
        this.stopTimer();
        this.mode = 'game';
        this.questions = [...(this.trilha.questoes || [])];
        this.qIndex = 0;
        this.correctCount = 0;
        this.answered = false;
        AppController.render();
      },

      startSrsSession(items) {
        if (!items || items.length === 0) return;
        this.active = true;
        this.mode = 'srs';
        this.disciplina = null;
        this.trilha = null;
        this.questions = items;
        this.qIndex = 0;
        this.correctCount = 0;
        this.answered = false;
        AppController.render();
      },

      toggleTimer() {
        if (this.timerRunning) {
          this.stopTimer();
        } else {
          this.timerRunning = true;
          this.timerInterval = setInterval(() => {
            if (this.timerSeconds > 0) {
              this.timerSeconds--;
              const el = document.getElementById('reading-timer-display');
              if (el) el.textContent = this.formatClock(this.timerSeconds);
            } else {
              this.stopTimer();
              UI.toast('Tempo concluído! Hora da Arena de Games.', '⏱️');
            }
          }, 1000);
        }
        AppController.render();
      },

      resetTimer() {
        this.stopTimer();
        this.timerSeconds = (this.trilha?.tempoLeituraMin || 5) * 60;
        AppController.render();
      },

      stopTimer() {
        if (this.timerInterval) clearInterval(this.timerInterval);
        this.timerInterval = null;
        this.timerRunning = false;
      },

      formatClock(sec) {
        const m = String(Math.floor(sec / 60)).padStart(2, '0');
        const s = String(sec % 60).padStart(2, '0');
        return `${m}:${s}`;
      },

      changeFont(delta) {
        StateStore.state.fontSize = Math.max(12, Math.min(22, (StateStore.state.fontSize || 15) + delta));
        StateStore.save();
        AppController.render();
      },

      toggleMarks() {
        StateStore.state.showMarks = !StateStore.state.showMarks;
        StateStore.save();
        AppController.render();
      },

      answerQuestion(userAnswer) {
        if (this.answered) return;
        const current = this.mode === 'srs' ? this.questions[this.qIndex].question : this.questions[this.qIndex];
        const isCorrect = userAnswer === current.respostaCorreta;

        this.answered = true;
        this.lastCorrect = isCorrect;
        if (isCorrect) {
          this.correctCount++;
          StateStore.registerStudyActivity(15);
          if (StateStore.state.errorBook[current.id]) {
            delete StateStore.state.errorBook[current.id];
            StateStore.save();
          }
        } else {
          const meta = this.mode === 'srs'
            ? { disciplinaId: this.questions[this.qIndex].disciplina.id, trilhaId: this.questions[this.qIndex].trilha.id }
            : { disciplinaId: this.disciplina.id, trilhaId: this.trilha.id };
          const prevErr = StateStore.state.errorBook[current.id] || { count: 0 };
          StateStore.state.errorBook[current.id] = {
            count: prevErr.count + 1,
            lastWrong: StateStore.getTodayKey(),
            ...meta
          };
          StateStore.save();
        }

        AppController.render();
      },

      rateSrsAndNext(rating) {
        const item = this.questions[this.qIndex];
        StateStore.scheduleSrs(item.question.id, rating, {
          disciplinaId: item.disciplina.id,
          trilhaId: item.trilha.id
        });
        this.nextQuestion();
      },

      nextQuestion() {
        this.qIndex++;
        this.answered = false;
        AppController.render();
      },

      finishTrilhaGame() {
        const total = this.questions.length;
        const pct = total > 0 ? Math.round((this.correctCount / total) * 100) : 100;
        if (pct === 100) {
          StateStore.state.completedTrilhas[this.trilha.id] = {
            completedAt: StateStore.getTodayKey(),
            bestScore: 100
          };
          // Agenda todas as questões da trilha dominada no SRS (3 dias)
          this.questions.forEach(q => {
            StateStore.scheduleSrs(q.id, 'good', { disciplinaId: this.disciplina.id, trilhaId: this.trilha.id });
          });
          StateStore.registerStudyActivity(50);
        }
        this.exit();
      },

      requestExit() {
        UI.confirm('Sair da sessão atual?', 'Seu progresso nesta etapa em andamento não será salvo até concluir.', () => this.exit());
      },

      exit() {
        this.stopTimer();
        this.active = false;
        this.mode = null;
        AppController.render();
      }
    };

                <!-- Barra de Progresso da Geração -->

      /* -------------------- PLAYER FULL-FOCUS -------------------- */
      renderPlayer() {
        const headerCenter = document.getElementById('player-header-center');
        const progressBar = document.getElementById('player-progress-bar');

        // FASE 1: LEITURA ATIVA CRONOMETRADA
        if (PlayerController.mode === 'reading') {
          headerCenter.innerHTML = `
            <p class="text-[10px] font-extrabold uppercase tracking-wider text-indigo-600 dark:text-indigo-400 truncate">${PlayerController.trilha.breadcrumb || PlayerController.disciplina.nome}</p>
            <p class="text-xs font-extrabold text-slate-900 dark:text-white truncate">Fase 1: Leitura Ativa</p>
          `;
          progressBar.style.width = '50%';

          const marksClass = StateStore.state.showMarks ? '' : 'hide-marks';
          const fontSize = StateStore.state.fontSize || 15;

          const articlesHtml = PlayerController.trilha.artigos.map(art => `
            <article class="bg-white dark:bg-slate-800/95 border border-slate-200/90 dark:border-slate-700/80 rounded-3xl p-4 shadow-xs">
              <div class="flex items-center justify-between gap-2 mb-3 pb-2 border-b border-slate-100 dark:border-slate-700/70">
                <span class="inline-flex items-center px-3 py-1 rounded-xl bg-indigo-600 text-white text-xs font-extrabold tracking-tight shadow-xs">
                  ${art.numero}
                </span>
                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Lei Seca</span>
              </div>
              <div class="law-text" style="font-size: ${fontSize}px;">
                ${LawParser.formatArticleBlocks(art.textoHtml)}
              </div>
            </article>
          `).join('');

          return `
            <div class="space-y-4 animate-fade-in ${marksClass}">
              <!-- Barra de Ferramentas de Leitura + Cronômetro -->
              <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-3xl p-3.5 space-y-3">
                <div>
                  <h2 class="text-sm font-extrabold text-slate-900 dark:text-white leading-snug">${PlayerController.trilha.titulo}</h2>
                  <p class="text-[11px] font-medium text-slate-500 dark:text-slate-400">${PlayerController.trilha.subtitulo}</p>
                </div>

                <div class="flex items-center justify-between gap-2 bg-slate-50 dark:bg-slate-900 rounded-2xl p-2.5">
                  <div class="flex items-center gap-2">
                    <span id="reading-timer-display" class="font-mono text-lg font-black text-indigo-600 dark:text-indigo-400">${PlayerController.formatClock(PlayerController.timerSeconds)}</span>
                    <button onclick="PlayerController.toggleTimer()" class="px-3 py-1.5 rounded-xl bg-indigo-600 text-white text-[11px] font-extrabold">
                      ${PlayerController.timerRunning ? 'Pausar' : 'Iniciar'}
                    </button>
                    <button onclick="PlayerController.resetTimer()" class="p-1.5 rounded-xl bg-slate-200 dark:bg-slate-800 text-xs">↺</button>
                  </div>

                  <div class="flex items-center gap-1">
                    <button onclick="PlayerController.changeFont(-1)" class="w-8 h-8 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-extrabold">A-</button>
                    <button onclick="PlayerController.changeFont(1)" class="w-8 h-8 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-extrabold">A+</button>
                  </div>
                </div>

                <button onclick="PlayerController.toggleMarks()" class="w-full py-2 rounded-xl text-[11px] font-extrabold border transition ${
                  StateStore.state.showMarks
                    ? 'bg-amber-50 dark:bg-amber-950/40 border-amber-300 dark:border-amber-700 text-amber-800 dark:text-amber-300'
                    : 'bg-slate-100 dark:bg-slate-900 border-slate-200 dark:border-slate-700 text-slate-500'
                }">
                  ${StateStore.state.showMarks ? '✨ Destaques VUNESP: LIGADOS' : '👁️ Destaques VUNESP: OCULTOS'}
                </button>
              </div>

              <!-- Cartões Individuais de Artigos -->
              <div class="space-y-3.5">
                ${articlesHtml}
              </div>

              <!-- Botão para Fase 2 -->
              <button onclick="PlayerController.startGamePhase()" class="w-full py-4 rounded-2xl bg-indigo-600 text-white text-sm font-extrabold hover:bg-indigo-700 shadow-lg shadow-indigo-600/25 transition">
                Concluir Leitura → Arena de Games (${PlayerController.trilha.questoes.length})
              </button>
            </div>
          `;
        }

        // FASE 2: ARENA DE GAMES OU REVISÃO SRS
        const total = PlayerController.questions.length;
        if (PlayerController.qIndex >= total) {
          progressBar.style.width = '100%';
          const pct = total > 0 ? Math.round((PlayerController.correctCount / total) * 100) : 100;
          const passed = pct === 100;

          return `
            <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-3xl p-6 text-center space-y-4 animate-fade-in">
              <div class="text-5xl">${passed ? '🏆' : '💪'}</div>
              <div>
                <h2 class="text-xl font-black text-slate-900 dark:text-white">${pct}% de Acerto</h2>
                <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">
                  ${PlayerController.correctCount} de ${total} questões corretas.
                </p>
              </div>
              ${PlayerController.mode === 'game' ? `
                <p class="text-xs font-semibold ${passed ? 'text-emerald-600 dark:text-emerald-400' : 'text-amber-600 dark:text-amber-400'}">
                  ${passed
                    ? 'Trilha dominada! Próxima etapa destravada e artigos enviados ao SRS.'
                    : 'Você precisa de 100% de acerto para destravar a próxima trilha. Os erros foram para o Caderno de Erros.'}
                </p>
                <div class="space-y-2 pt-2">
                  ${!passed ? `<button onclick="PlayerController.startGamePhase()" class="w-full py-3 rounded-2xl bg-indigo-600 text-white text-xs font-extrabold">Tentar Arena Novamente</button>` : ''}
                  <button onclick="PlayerController.finishTrilhaGame()" class="w-full py-3 rounded-2xl ${passed ? 'bg-emerald-600 text-white' : 'bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200'} text-xs font-extrabold">
                    ${passed ? 'Concluir e Voltar às Trilhas' : 'Voltar às Trilhas'}
                  </button>
                </div>
              ` : `
                <button onclick="PlayerController.exit()" class="w-full py-3 rounded-2xl bg-indigo-600 text-white text-xs font-extrabold">Concluir Sessão</button>
              `}
            </div>
          `;
        }

        const currentItem = PlayerController.questions[PlayerController.qIndex];
        const q = PlayerController.mode === 'srs' ? currentItem.question : currentItem;
        progressBar.style.width = `${Math.round(((PlayerController.qIndex + 1) / total) * 100)}%`;

        headerCenter.innerHTML = `
          <p class="text-[10px] font-extrabold uppercase tracking-wider text-indigo-600 dark:text-indigo-400">${q.artigoRef}</p>
          <p class="text-xs font-extrabold text-slate-900 dark:text-white">Questão ${PlayerController.qIndex + 1} de ${total}</p>
        `;

        const tipoBadge = q.tipo === 'true_false' ? 'Certo ou Errado' : q.tipo === 'cloze' ? 'Complete a Lacuna' : 'Múltipla Escolha';

        let optionsHtml = '';
        if (q.tipo === 'true_false') {
          optionsHtml = `
            <div class="grid grid-cols-2 gap-3">
              <button ${PlayerController.answered ? 'disabled' : ''} onclick="PlayerController.answerQuestion(true)" class="py-4 rounded-2xl border-2 text-sm font-extrabold transition ${
                PlayerController.answered && q.respostaCorreta === true
                  ? 'bg-emerald-500 border-emerald-500 text-white'
                  : 'bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 hover:border-indigo-500'
              }">✓ CERTO</button>
              <button ${PlayerController.answered ? 'disabled' : ''} onclick="PlayerController.answerQuestion(false)" class="py-4 rounded-2xl border-2 text-sm font-extrabold transition ${
                PlayerController.answered && q.respostaCorreta === false
                  ? 'bg-emerald-500 border-emerald-500 text-white'
                  : 'bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 hover:border-indigo-500'
              }">✕ ERRADO</button>
            </div>
          `;
        } else if (q.tipo === 'cloze') {
          optionsHtml = `
            <div class="grid grid-cols-2 gap-2.5">
              ${(q.opcoes || []).map(opt => `
                <button ${PlayerController.answered ? 'disabled' : ''} onclick="PlayerController.answerQuestion(${JSON.stringify(opt).replace(/"/g, '&quot;')})" class="p-3.5 rounded-2xl border-2 text-xs font-extrabold transition ${
                  PlayerController.answered && opt === q.respostaCorreta
                    ? 'bg-emerald-500 border-emerald-500 text-white'
                    : 'bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 hover:border-indigo-500'
                }">${opt}</button>
              `).join('')}
            </div>
          `;
        } else {
          optionsHtml = `
            <div class="space-y-2.5">
              ${(q.opcoes || []).map((opt, i) => `
                <button ${PlayerController.answered ? 'disabled' : ''} onclick="PlayerController.answerQuestion(${i})" class="w-full text-left p-3.5 rounded-2xl border-2 text-xs font-bold transition ${
                  PlayerController.answered && i === q.respostaCorreta
                    ? 'bg-emerald-500 border-emerald-500 text-white'
                    : 'bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 hover:border-indigo-500'
                }">
                  <span class="opacity-60 mr-2">${String.fromCharCode(65 + i)})</span>${opt}
                </button>
              `).join('')}
            </div>
          `;
        }

        const feedbackHtml = PlayerController.answered ? `
          <div class="rounded-3xl p-4 border space-y-3 animate-fade-in ${
            PlayerController.lastCorrect
              ? 'bg-emerald-50 dark:bg-emerald-950/40 border-emerald-300 dark:border-emerald-800'
              : 'bg-rose-50 dark:bg-rose-950/40 border-rose-300 dark:border-rose-800'
          }">
            <p class="text-xs font-black ${PlayerController.lastCorrect ? 'text-emerald-700 dark:text-emerald-300' : 'text-rose-700 dark:text-rose-300'}">
              ${PlayerController.lastCorrect ? '✅ Resposta Correta!' : '❌ Atenção à Pegadinha VUNESP!'}
            </p>
            <div class="law-text bg-white/80 dark:bg-slate-900/70 rounded-2xl p-3 text-xs leading-relaxed text-slate-800 dark:text-slate-100">
              ${q.textoLiteral}
            </div>
            <p class="text-[11px] font-semibold text-slate-600 dark:text-slate-300">💡 ${q.dicaVunesp}</p>

            ${PlayerController.mode === 'srs' ? `
              <div class="grid grid-cols-4 gap-1.5 pt-1">
                <button onclick="PlayerController.rateSrsAndNext('again')" class="py-2 rounded-xl bg-rose-600 text-white text-[10px] font-extrabold">Errei<br/>Hoje</button>
                <button onclick="PlayerController.rateSrsAndNext('hard')" class="py-2 rounded-xl bg-amber-500 text-slate-950 text-[10px] font-extrabold">Difícil<br/>1d</button>
                <button onclick="PlayerController.rateSrsAndNext('good')" class="py-2 rounded-xl bg-indigo-600 text-white text-[10px] font-extrabold">Bom<br/>3d</button>
                <button onclick="PlayerController.rateSrsAndNext('easy')" class="py-2 rounded-xl bg-emerald-600 text-white text-[10px] font-extrabold">Fácil<br/>7d+</button>
              </div>
            ` : `
              <button onclick="PlayerController.nextQuestion()" class="w-full py-3 rounded-2xl bg-slate-900 dark:bg-white text-white dark:text-slate-900 text-xs font-extrabold">
                Próxima Questão →
              </button>
            `}
          </div>
        ` : '';

        return `
          <div class="space-y-4 animate-fade-in">
            <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-3xl p-5 space-y-3">
              <span class="inline-block px-2.5 py-1 rounded-lg bg-indigo-50 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400 text-[10px] font-extrabold uppercase tracking-wider">${tipoBadge}</span>
              <p class="text-sm font-bold text-slate-900 dark:text-white leading-relaxed">${q.enunciado}</p>
            </div>

            ${optionsHtml}
            ${feedbackHtml}
          </div>
        `;
      }
    };

    window.addEventListener('DOMContentLoaded', () => AppController.init());
  </script>
</body>
</html>
