      bindDropzone() {
        const dz = document.getElementById('docx-dropzone');
        const inp = document.getElementById('docx-input');
        if (!dz || !inp) return;
        dz.onclick = () => inp.click();
        dz.ondragover = (e) => { e.preventDefault(); dz.classList.add('ring-2', 'ring-indigo-500'); };
        dz.ondragleave = () => dz.classList.remove('ring-2', 'ring-indigo-500');
        dz.ondrop = (e) => {
          e.preventDefault();
          dz.classList.remove('ring-2', 'ring-indigo-500');
          if (e.dataTransfer.files?.[0]) this.handleDocxFile(e.dataTransfer.files[0]);
        };
      },

      async handleDocxFile(file) {
        if (!file) return;
        if (!file.name.toLowerCase().endsWith('.docx')) { showToast('Selecione um arquivo .docx válido.', 'error'); return; }
        try {
          const buf = await file.arrayBuffer();
          const res = await mammoth.extractRawText({ arrayBuffer: buf });
          this.importDraft = LawParser.parse(res.value || '', this.importDestDisc, this.importSplitSix);
          if (this.importDraft.totalArticles === 0) showToast('Nenhum "Art." detectado no documento.', 'warn');
          else showToast(`${this.importDraft.totalArticles} artigos lidos em ${this.importDraft.trails.length} trilhas!`, 'success');
          this.render();
        } catch (e) {
          showToast('Erro ao ler .docx: ' + e.message, 'error');
        }
      },

      parseManualText() {
        const txt = (document.getElementById('manual-law-text')?.value || '').trim();
        if (!txt) { showToast('Cole o texto da lei primeiro.', 'warn'); return; }
        this.importDraft = LawParser.parse(txt, this.importDestDisc, this.importSplitSix);
        this.render();
      },

      async commitImport(useAI) {
        if (!this.importDraft) return;
        const chosen = this.importDraft.trails.filter((t) => t.selected);
        if (!chosen.length) { showToast('Selecione ao menos uma trilha.', 'warn'); return; }

        const progEl = document.getElementById('import-progress');
        if (progEl) progEl.classList.remove('hidden');

        for (let i = 0; i < chosen.length; i++) {
          const t = { ...chosen[i] };
          delete t.selected;
          if (progEl) progEl.textContent = `⏳ Processando trilha ${i + 1} de ${chosen.length}: ${t.title}...`;

          if (useAI) {
            try {
              await VunespEngine.upgradeTrailWithAI(t, false);
            } catch (e) {
              t.questions = VunespEngine.generateOfflineQuestions(t);
              t.origemIa = false;
              showToast(`Fallback offline na trilha ${i + 1}: ${e.message}`, 'warn');
            }
          } else {
            t.questions = VunespEngine.generateOfflineQuestions(t);
          }
          state.trails.push(t);
        }

        this.importDraft = null;
        persistState(true);
        showToast(`${chosen.length} trilha(s) adicionada(s) com sucesso!`, 'success');
        this.selectedDiscId = this.importDestDisc;
        this.setTab('trilhas');
      },

      deleteTrail(trailId) {
        state.trails = state.trails.filter((t) => t.id !== trailId);
        delete state.progress[trailId];
        persistState(true);
        showToast('Trilha excluída.', 'info');
        this.render();
      },

              <div class="flex gap-2">
                <button onclick="App.saveQuickKeyAndRun('${trailId}', ${extraOnly})" class="flex-1 py-2.5 rounded-xl bg-indigo-600 text-white text-xs font-extrabold">Salvar e Executar IA</button>
                ${extraOnly ? `<button onclick="Modal.close(); App.runOfflineExtra('${trailId}')" class="px-3 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-extrabold">Usar Offline</button>` : ''}
              </div>
            </div>
          `);
          return;
        }
        this.runUpgradeAI(trailId, extraOnly);
      },

      saveQuickKeyAndRun(trailId, extraOnly) {
        const k = (document.getElementById('quick-gemini-key')?.value || '').trim();
        if (!k) { showToast('Informe a chave.', 'warn'); return; }
        localStorage.setItem(LS_KEYS.GEMINI_KEY, k);
        Modal.close();
        this.runUpgradeAI(trailId, extraOnly);
      },

      runOfflineExtra(trailId) {
        const t = state.trails.find((x) => x.id === trailId);
        if (!t) return;
        const added = VunespEngine.generateOfflineQuestions(t);
        t.questions = [...(t.questions || []), ...added];
        persistState(true);
        showToast(`+${added.length} questões geradas offline!`, 'success');
        if (!document.getElementById('player-overlay').classList.contains('hidden')) Player.renderRead();
        else this.render();
      },

      async runUpgradeAI(trailId, extraOnly) {
        const t = state.trails.find((x) => x.id === trailId);
        if (!t) return;
        showToast(extraOnly ? '✨ Gerando questões inéditas com Gemini...' : '✨ Aplicando marcação cirúrgica VUNESP com IA...', 'info');
        try {
          await VunespEngine.upgradeTrailWithAI(t, extraOnly);
          persistState(true);
          showToast(extraOnly ? 'Novas questões adicionadas com sucesso!' : 'Upgrade com IA concluído!', 'success');
          if (!document.getElementById('player-overlay').classList.contains('hidden') && Player.mode === 'read') Player.renderRead();
          else this.render();
        } catch (e) {
          showToast('Erro Gemini: ' + e.message, 'error');
        }
      },

                  <span class="text-xs font-bold text-slate-500">Modo de Tela:</span>
                  <select onchange="App.setViewportMode(this.value)" class="js-viewport-select px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-bold">
                    <option value="auto">Automático</option>
                    <option value="desktop">PC (Desktop)</option>
                    <option value="mobile">Celular</option>
                  </select>
                </div>
              </div>
            </div>

            <!-- Zona de Perigo -->
            <div class="bg-rose-50 dark:bg-rose-950/20 rounded-3xl border border-rose-200 dark:border-rose-900 p-5 flex flex-wrap items-center justify-between gap-3">
              <div>
                <h3 class="font-black text-sm text-rose-700 dark:text-rose-400">⚠️ Zona de Perigo</h3>
                <p class="text-xs text-rose-600/80 dark:text-rose-300/80">Elimina todas as trilhas (inclusive exemplos), Banco de Questões, SRS, XP e dados na nuvem.</p>
              </div>
              <button onclick="App.openWipeModal()" class="px-4 py-2.5 rounded-xl bg-rose-600 text-white text-xs font-black">🗑️ Limpar Tudo (Começar do Zero)</button>
            </div>
          </div>
        `;
      },

      shiftSimDay(delta, reset = false) {
        state.settings.simDayOffset = reset ? 0 : (state.settings.simDayOffset || 0) + delta;
        persistState(false);
        this.render();
      },

      saveFirebaseJson() {
        try {
          const parsed = JSON.parse(document.getElementById('cfg-fb-json').value.trim());
          if (!isValidFirebaseConfig(parsed)) throw new Error('JSON precisa conter apiKey, authDomain e projectId válidos.');
          localStorage.setItem(LS_KEYS.FB_CFG, JSON.stringify(parsed));
          initFirebase();
          showToast('Firebase configurado! Clique em Entrar.', 'success');
          this.render();
        } catch (e) {
          showToast('JSON inválido: ' + e.message, 'error');
        }
      },

      exportBackup() {
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `decorei_tjsp_backup_${todayISO(0)}.json`;
        a.click();
        showToast('Backup exportado!', 'success');
      },

      async importBackup(file) {
        if (!file) return;
        try {
          const data = JSON.parse(await file.text());
          if (!Array.isArray(data.trails)) throw new Error('Arquivo de backup inválido.');
          state = { ...createEmptyState(false), ...data };
          persistState(true);
          showToast(`Backup restaurado (${state.trails.length} trilhas)!`, 'success');
          this.render();
        } catch (e) {
          showToast('Erro ao importar backup: ' + e.message, 'error');
        }
      },

      openWipeModal() {
        Modal.open(`
          <div class="space-y-4">
            <h3 class="font-black text-lg text-rose-600">🗑️ Limpar Tudo</h3>
            <p class="text-xs text-slate-500">Esta ação apaga todas as trilhas, progresso, SRS, erros e disciplinas personalizadas no dispositivo e no Firebase. Digite <strong>ZERAR</strong> para confirmar:</p>
            <input id="wipe-confirm-input" placeholder="Digite ZERAR" class="w-full px-3 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-rose-300 text-xs font-black uppercase" />
            <div class="flex gap-2">
              <button onclick="App.executeWipe()" class="flex-1 py-2.5 rounded-xl bg-rose-600 text-white text-xs font-black">Confirmar Limpeza</button>
              <button onclick="Modal.close()" class="px-4 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-bold">Cancelar</button>
            </div>
          </div>
        `);
      },

      async executeWipe() {
        if ((document.getElementById('wipe-confirm-input')?.value || '').trim().toUpperCase() !== 'ZERAR') {
          showToast('Digite ZERAR exatamente para confirmar.', 'warn');
          return;
        }
        state = createEmptyState(false);
        await LocalDB.clear();
        await LocalDB.set('app_state', state);
        rebuildQuestionBank();
        if (CloudSync.isSignedIn()) await CloudSync.wipeCloud();
        Modal.close();
        this.selectedDiscId = null;
        showToast('Aplicativo zerado com sucesso!', 'success');
        this.render();
      }
    };

    window.addEventListener('DOMContentLoaded', () => App.init());
  </script>
</body>
</html>
