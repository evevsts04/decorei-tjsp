    function escHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function uid(prefix = 'id') {
      return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 7)}`;
    }

    function todayISO(offsetDays = 0) {
      const d = new Date();
      d.setHours(12, 0, 0, 0);
      d.setDate(d.getDate() + (state?.settings?.simDayOffset || 0) + offsetDays);
      return d.toISOString().slice(0, 10);
    }

    function showToast(msg, type = 'info') {
      const root = document.getElementById('toast-root');
      const colors = {
        info: 'bg-slate-900 text-white dark:bg-slate-100 dark:text-slate-900',
        success: 'bg-emerald-600 text-white',
        error: 'bg-rose-600 text-white',
        warn: 'bg-amber-500 text-slate-950'

      el.className = `pointer-events-auto px-4 py-2.5 rounded-2xl shadow-lg text-xs font-extrabold animate-fade-in max-w-xs ${colors[type] || colors.info}`;
      el.textContent = msg;
      root.appendChild(el);
      setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .25s'; setTimeout(() => el.remove(), 260); }, 3200);
    }

    function createEmptyState(withSeeds = true) {
      return {
        trails: withSeeds ? JSON.parse(JSON.stringify(INITIAL_SEED_TRAILS)) : [],
        customDisciplines: [],
        seedDeleted: !withSeeds,
        progress: {},   // { [trailId]: { mastered: bool, bestScore: number, updatedAt: string } }
        srs: {},        // { [questionId]: { due: 'YYYY-MM-DD', interval: number, ease: number, reps: number } }
        errors: [],     // array de questionId
        stats: { xp: 0, streak: 0, lastStudyDate: null, todayCount: 0, todayDate: null },
        settings: {
          fontSize: 16,
          showMarks: true,
          prioritizeHighIncidence: true,
          simDayOffset: 0
        },
        updatedAt: Date.now()
      };
    }

    let state = createEmptyState(true);
    let questionBankCache = []; // reconstruído em memória a partir de state.trails

    function getAllDisciplines() {
      return [...DEFAULT_DISCIPLINES, ...(state.customDisciplines || [])];
    }

    function getDiscipline(id) {
      return getAllDisciplines().find((d) => d.id === id) || { id, short: id, name: id, icon: '📄' };
    }

    function rebuildQuestionBank() {
      const list = [];
      (state.trails || []).forEach((t) => {
        (t.questions || []).forEach((q) => {
          list.push({
            ...q,
            trailId: t.id,
            trailTitle: t.title,
            disciplineId: t.disciplineId
          });
        });
      });
      questionBankCache = list;
      return list;
    }

    // =========================================================================
    // 4. INDEXEDDB LOCAL (SEM LIMITE DE 5MB DO LOCALSTORAGE)
    // =========================================================================
    const LocalDB = {
      dbName: 'DecoreiTJSP_DB',
      storeName: 'kv',
      _db: null,
      open() {
        if (this._db) return Promise.resolve(this._db);
        return new Promise((resolve, reject) => {
          const req = indexedDB.open(this.dbName, 1);
          req.onupgradeneeded = () => {
            if (!req.result.objectStoreNames.contains(this.storeName)) {
              req.result.createObjectStore(this.storeName);
            }
          };
          req.onsuccess = () => { this._db = req.result; resolve(this._db); };
          req.onerror = () => reject(req.error);
        });
      },
      async get(key) {
        try {
          const db = await this.open();
          return await new Promise((res, rej) => {
            const tx = db.transaction(this.storeName, 'readonly');
            const req = tx.objectStore(this.storeName).get(key);
            req.onsuccess = () => res(req.result);
            req.onerror = () => rej(req.error);
          });
        } catch (e) { return null; }
      },
      async set(key, val) {
        try {
          const db = await this.open();
          return await new Promise((res, rej) => {
            const tx = db.transaction(this.storeName, 'readwrite');
            tx.objectStore(this.storeName).put(val, key);
            tx.oncomplete = () => res(true);
            tx.onerror = () => rej(tx.error);
          });
        } catch (e) { console.error('IndexedDB set error:', e); return false; }
      },
      async clear() {
        try {
          const db = await this.open();
          return await new Promise((res, rej) => {
            const tx = db.transaction(this.storeName, 'readwrite');
            tx.objectStore(this.storeName).clear();
            tx.oncomplete = () => res(true);
            tx.onerror = () => rej(tx.error);
          });
        } catch (e) { return false; }
      }
    };

    async function loadLocalState() {
      let saved = await LocalDB.get('app_state');
      if (!saved) {
        // Migração automática do localStorage antigo se existir
        try {
          const legacyRaw = localStorage.getItem(LS_KEYS.LEGACY_STATE);
          if (legacyRaw) {
            saved = JSON.parse(legacyRaw);
            await LocalDB.set('app_state', saved);
            localStorage.removeItem(LS_KEYS.LEGACY_STATE);
          }
        } catch (e) {}
      }
      if (saved && typeof saved === 'object') {
        const base = createEmptyState(!saved.seedDeleted);
        state = {
          ...base,
          ...saved,
          stats: { ...base.stats, ...(saved.stats || {}) },
          settings: { ...base.settings, ...(saved.settings || {}) }
        };
      } else {
        state = createEmptyState(true);
      }
      rebuildQuestionBank();
    }

    let saveTimer = null;
    function persistState(syncCloud = true) {
      state.updatedAt = Date.now();
      rebuildQuestionBank();
      LocalDB.set('app_state', state);
      if (syncCloud && CloudSync.isSignedIn()) {
        clearTimeout(saveTimer);
        saveTimer = setTimeout(() => CloudSync.pushAll(false), 1200);
      }
    }

    // =========================================================================
    // 5. FIREBASE AUTH + CLOUD FIRESTORE FRAGMENTADO (1 DOC POR TRILHA)
    // =========================================================================
    let fbAuth = null;
    let fbDb = null;
    let currentUser = null;

    function isValidFirebaseConfig(cfg) {
      if (!cfg || typeof cfg !== 'object') return false;
      return ['apiKey', 'authDomain', 'projectId'].every((k) => {
        const v = String(cfg[k] || '').trim();
        return v.length > 5 && !v.includes('COLE_') && !v.includes('SEU_PROJETO') && !v.includes('SUA_');
      });
    }

    function getActiveFirebaseConfig() {
      // Prioridade 1: Chaves inseridas diretamente no código
      if (isValidFirebaseConfig(DEFAULT_FIREBASE_CONFIG)) {
        return DEFAULT_FIREBASE_CONFIG;
      }
      // Prioridade 2: Fallback para JSON salvo na aba Ajustes
      try {
        const saved = JSON.parse(localStorage.getItem(LS_KEYS.FB_CFG) || 'null');
        if (isValidFirebaseConfig(saved)) return saved;
        if (saved) localStorage.removeItem(LS_KEYS.FB_CFG);
      } catch (e) {
        localStorage.removeItem(LS_KEYS.FB_CFG);
      }
      return null;
    }

    function initFirebase() {
      const cfg = getActiveFirebaseConfig();
      if (!cfg || typeof firebase === 'undefined') return false;
      try {
        if (!firebase.apps.length) firebase.initializeApp(cfg);
        fbAuth = firebase.auth();
        fbDb = firebase.firestore();
        fbAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(() => {});
        fbAuth.onAuthStateChanged(async (user) => {
          currentUser = user;
          updateAuthBadges();
          if (user) {
            await CloudSync.pullAll();
          }
        });
        return true;
      } catch (e) {
        console.error('Erro ao inicializar Firebase:', e);
        return false;
      }
    }

    function setSyncLabel(txt) {
      document.querySelectorAll('.js-sync-status').forEach((el) => (el.textContent = txt));
    }

    function updateAuthBadges() {
      const label = currentUser ? `☁️ ${currentUser.email || currentUser.displayName || 'Conectado'}` : '👤 Modo Local';
      const short = currentUser ? `☁️ ${(currentUser.displayName || currentUser.email || 'Conta').split('@')[0]}` : '👤 Entrar';
      document.querySelectorAll('.js-auth-label').forEach((el) => (el.textContent = label));
      document.querySelectorAll('.js-auth-short').forEach((el) => (el.textContent = short));
      if (!currentUser) setSyncLabel('💾 IndexedDB local');
    }

    const CloudSync = {
      isSignedIn() { return !!(fbDb && currentUser); },

      async pushAll(showFeedback = true) {
        if (!this.isSignedIn()) {
          if (showFeedback) showToast('Faça login para sincronizar na nuvem.', 'warn');
          return false;
        }
        try {
          setSyncLabel('⏳ Sincronizando...');
          const userRef = fbDb.collection('users').doc(currentUser.uid);
          const dadosRef = userRef.collection('dados');
          const trilhasCol = userRef.collection('trilhas');

          // 1. Grava metadados e resultados em documentos leves separados
          await Promise.all([
            dadosRef.doc('meta').set({
              customDisciplines: state.customDisciplines || [],
              seedDeleted: !!state.seedDeleted,
              settings: state.settings || {},
              updatedAt: state.updatedAt || Date.now()
            }),
            dadosRef.doc('resultados').set({
              progress: state.progress || {},
              srs: state.srs || {},
              errors: state.errors || [],
              stats: state.stats || {},
              updatedAt: state.updatedAt || Date.now()
            })
          ]);

          // 2. Fragmentação: 1 documento por trilha (nunca ultrapassa 1 MB)
          const existingSnap = await trilhasCol.get();
          const currentIds = new Set((state.trails || []).map((t) => t.id));
          const ops = [];

          existingSnap.forEach((doc) => {
            if (!currentIds.has(doc.id)) ops.push({ type: 'delete', ref: doc.ref });
          });
          (state.trails || []).forEach((t) => {
            ops.push({ type: 'set', ref: trilhasCol.doc(t.id), data: t });
          });

          // Executa em lotes de 400 operações (limite do Firestore é 500)
          for (let i = 0; i < ops.length; i += 400) {
            const batch = fbDb.batch();
            ops.slice(i, i + 400).forEach((op) => {
              if (op.type === 'delete') batch.delete(op.ref);
              else batch.set(op.ref, op.data);
            });
            await batch.commit();
          }

          setSyncLabel('✅ Nuvem atualizada');
          if (showFeedback) showToast('Sincronizado com o Firebase (1 doc/trilha)!', 'success');
          return true;
        } catch (e) {
          console.error('Erro CloudSync.pushAll:', e);
          setSyncLabel('⚠️ Erro na nuvem');
          if (showFeedback) showToast(`Erro ao sincronizar: ${e.message || e.code}`, 'error');
          return false;
        }
      },

      async pullAll() {
        if (!this.isSignedIn()) return;
        try {
          setSyncLabel('⏳ Baixando nuvem...');
          const userRef = fbDb.collection('users').doc(currentUser.uid);
          const [metaSnap, resSnap, trilhasSnap] = await Promise.all([
            userRef.collection('dados').doc('meta').get(),
            userRef.collection('dados').doc('resultados').get(),
            userRef.collection('trilhas').get()
          ]);

          let cloudTrails = [];
          trilhasSnap.forEach((d) => cloudTrails.push(d.data()));

          // Migração automática de formato legado (documento único) se necessário
          if (!metaSnap.exists && cloudTrails.length === 0) {
            const legacyTrailsSnap = await userRef.collection('dados').doc('trilhas').get();
            if (legacyTrailsSnap.exists && Array.isArray(legacyTrailsSnap.data().trails)) {
              cloudTrails = legacyTrailsSnap.data().trails;
              state.trails = cloudTrails;
              if (Array.isArray(legacyTrailsSnap.data().customDisciplines)) {
                state.customDisciplines = legacyTrailsSnap.data().customDisciplines;
              }
              await this.pushAll(false);
            } else {
              // Primeira vez na nuvem: sobe dados locais
              await this.pushAll(false);
              return;
            }
          }

          const meta = metaSnap.exists ? metaSnap.data() : {};
          const res = resSnap.exists ? resSnap.data() : {};
          const cloudUpdated = Math.max(meta.updatedAt || 0, res.updatedAt || 0);

          if (cloudUpdated >= (state.updatedAt || 0) || cloudTrails.length > 0) {
            state.trails = cloudTrails.sort((a, b) => (a.order || 0) - (b.order || 0));
            if (Array.isArray(meta.customDisciplines)) state.customDisciplines = meta.customDisciplines;
            if (typeof meta.seedDeleted === 'boolean') state.seedDeleted = meta.seedDeleted;
            if (meta.settings) state.settings = { ...state.settings, ...meta.settings };
            if (res.progress) state.progress = res.progress;
            if (res.srs) state.srs = res.srs;
            if (Array.isArray(res.errors)) state.errors = res.errors;
            if (res.stats) state.stats = { ...state.stats, ...res.stats };
            state.updatedAt = cloudUpdated || Date.now();
            await LocalDB.set('app_state', state);
            rebuildQuestionBank();
          }

          setSyncLabel('✅ Nuvem conectada');
          App.render();
        } catch (e) {
          console.error('Erro CloudSync.pullAll:', e);
          setSyncLabel('⚠️ Falha ao baixar');
        }
      },

      async wipeCloud() {
        if (!this.isSignedIn()) return;
        const userRef = fbDb.collection('users').doc(currentUser.uid);
        const snap = await userRef.collection('trilhas').get();
        const docs = snap.docs;
        for (let i = 0; i < docs.length; i += 400) {
          const batch = fbDb.batch();
          docs.slice(i, i + 400).forEach((d) => batch.delete(d.ref));
          await batch.commit();
        }
        await userRef.collection('dados').doc('meta').set({
          customDisciplines: [], seedDeleted: true, settings: state.settings, updatedAt: Date.now()
        });
        await userRef.collection('dados').doc('resultados').set({
          progress: {}, srs: {}, errors: [], stats: state.stats, updatedAt: Date.now()
        });
      }
    };

    function formatAuthError(err) {
      const map = {
        'auth/invalid-credential': 'E-mail ou senha incorretos.',
        'auth/user-not-found': 'Usuário não encontrado.',
        'auth/wrong-password': 'Senha incorreta.',
        'auth/email-already-in-use': 'Este e-mail já está cadastrado.',
        'auth/weak-password': 'A senha deve ter pelo menos 6 caracteres.',
        'auth/popup-blocked': 'Pop-up bloqueado pelo navegador. Libere pop-ups ou use E-mail/Senha.',
        'auth/unauthorized-domain': 'Domínio não autorizado no Firebase Console (Authentication → Settings → Authorized domains).'
      };
      return map[err?.code] || err?.message || 'Erro na autenticação.';
    }

    // =========================================================================
    // 7. MOTOR DE MARCAÇÃO CIRÚRGICA VUNESP (4 CORES) + REGEX + IA GEMINI
    // =========================================================================
    const VunespEngine = {
      applyOfflineMarks(text) {
        let html = escHtml(text);
        // 1. Exceção / Restrição
        html = html.replace(/\b(salvo|exceto|vedado|vedada|vedados|vedadas|proibido|proibida|somente|apenas|sempre que|em regra|ressalvado|ressalvada|ressalvados|ressalvadas|independentemente|nunca|jamais|não se aplica|sob pena de)\b/gi,
          '<span class="v-exc">$1</span>');
        // 2. Prazo / Número / Quórum
        html = html.replace(/\b(\d+(?:[\.,]\d+)?\s*(?:dias?\s*úteis|dias?\s*corridos|dias?|horas?|meses|mês|anos?|salários?-mínimos?|%|por cento)|\d+\/\d+|maioria absoluta|maioria simples|dois terços|três quintos|reclusão|detenção)\b/gi,
          '<span class="v-prazo">$1</span>');
        // 3. Competência / Sujeito
        html = html.replace(/\b(Juiz(?:es)?(?:\s+de\s+Direito|\s+Corregedor\s+Permanente)?|Escriv[ãa]o|Chefe de Secretaria|Oficial de Justiça|Corregedor Geral(?: da Justiça)?|funcionário público|servidor(?:es)? públicos?|Ministério Público|Tribunal de Justiça|Órgão Especial|Conselho Superior da Magistratura|autoridade competente)\b/gi,
          '<span class="v-comp">$1</span>');
        // 4. Conceito / Elemento nuclear
        html = html.replace(/\b(dolo|dolosa|doloso|culpa|culposa|culposo|indulgência|segredo de justiça|trânsito em julgado|ampla defesa|contraditório|impedimento|suspeição|prescrição|decadência|inafiançável|imprescritível|de ofício|lei complementar|lei ordinária)\b/gi,
          '<span class="v-conc">$1</span>');
        return html;
      },

      generateOfflineQuestions(trail) {
        const qs = [];
        const existingPrompts = new Set((trail.questions || []).map((q) => q.enunciado.toLowerCase()));

        // Regras estritas do método Cloze (apenas termos jurídicos estratégicos; nunca artigos/preposições simples)
        const clozeRules = [
          {
            category: 'prazo',
            rx: /\b(\d+(?:[\.,]\d+)?\s*(?:dias?\s*úteis|dias?\s*corridos|dias?|horas?|meses|mês|anos?|salários?-mínimos?|%|por cento)|\d+\/\d+|maioria absoluta|maioria simples|dois terços|três quintos|durante o dia)\b/gi,
            getDistractors: (ans) => {
              const lower = ans.toLowerCase();
              if (lower.includes('durante o dia')) return ['a qualquer hora', 'durante a noite', 'em dias úteis', 'mediante aviso prévio'];
              if (lower.includes('hora')) return ['12 horas', '24 horas', '48 horas', '72 horas', '6 horas'];
              if (lower.includes('mês') || lower.includes('mes')) return ['1 mês', '2 meses', '3 meses', '6 meses', '12 meses'];
              if (lower.includes('ano')) return ['1 ano', '2 anos', '3 anos', '5 anos', '8 anos', '10 anos'];
              if (lower.includes('salário')) return ['20 salários-mínimos', '30 salários-mínimos', '40 salários-mínimos', '60 salários-mínimos'];
              if (lower.includes('%') || lower.includes('por cento')) return ['10%', '25%', '50%', '70%', '90%'];
              if (lower.includes('maioria') || lower.includes('terços') || lower.includes('quintos') || lower.includes('/')) {
                return ['maioria absoluta', 'maioria simples', 'dois terços', 'três quintos', '1/3', '2/3'];
              }
              if (lower.includes('úteis')) return ['3 dias úteis', '5 dias úteis', '10 dias úteis', '15 dias úteis', '30 dias úteis'];
              if (lower.includes('corridos')) return ['5 dias corridos', '10 dias corridos', '15 dias corridos', '30 dias corridos'];
              return ['2 dias', '3 dias', '5 dias', '10 dias', '15 dias', '30 dias', '60 dias', '90 dias'];
            },
            tip: 'Atenção aos prazos, números, quóruns e limites exatos da redação literal.'
          },
          {
            category: 'excecao',
            rx: /\b(salvo|exceto|ressalvado|ressalvada|ressalvados|ressalvadas|independentemente|em regra|sempre que)\b/gi,
            getDistractors: () => ['salvo', 'exceto', 'inclusive', 'ressalvado', 'independentemente', 'mediante', 'sempre que', 'em regra'],
            tip: 'Termos de exceção são os alvos preferidos de inversão pelas bancas.'
          },
          {
            category: 'permissao',
            rx: /\b(vedado|vedada|vedados|vedadas|proibido|proibida|facultado|facultada|facultativo|facultativa|obrigatório|obrigatória|somente|apenas|exclusivamente|nunca|jamais|poderá|deverá)\b/gi,
            getDistractors: (ans) => {
              const l = ans.toLowerCase();
              if (l === 'poderá' || l === 'deverá') return ['poderá', 'deverá', 'não poderá', 'deixará de'];
              return ['vedado', 'permitido', 'facultado', 'obrigatório', 'somente', 'inclusive', 'exclusivamente', 'proibido'];
            },
            tip: 'Observe a diferença entre proibição, faculdade e obrigatoriedade (ex.: poderá vs. deverá).'
          },
          {
            category: 'competencia',
            rx: /\b(Juiz(?:es)?(?:\s+de\s+Direito|\s+Corregedor\s+Permanente)?|Escriv[ãa]o|Chefe de Secretaria|Oficial de Justiça|Corregedor Geral(?: da Justiça)?|funcionário público|servidor(?:es)? públicos?|Ministério Público|Tribunal de Justiça|Órgão Especial|Conselho Superior da Magistratura|autoridade competente|determinação judicial)\b/gi,
            getDistractors: () => ['Juiz de Direito', 'Escrivão', 'Oficial de Justiça', 'Corregedor Geral da Justiça', 'Ministério Público', 'Órgão Especial', 'autoridade competente', 'determinação judicial'],
            tip: 'Confira exatamente qual autoridade ou sujeito pratica o ato no dispositivo.'
          },
          {
            category: 'conceito',
            rx: /\b(reclusão|detenção|indulgência|dolo|dolosa|doloso|culpa|culposa|culposo|impedimento|suspeição|prescrição|decadência|inafiançável|imprescritível|segredo de justiça|trânsito em julgado|ampla defesa|contraditório|de ofício|lei complementar|lei ordinária)\b/gi,
            getDistractors: () => ['reclusão', 'detenção', 'dolo', 'culpa', 'impedimento', 'suspeição', 'prescrição', 'decadência', 'de ofício', 'lei complementar', 'lei ordinária'],
            tip: 'Conceito jurídico nuclear cobrado na literalidade da lei seca.'
          }
        ];

        const extractStrategicMatches = (segment) => {
          const found = [];
          for (const rule of clozeRules) {
            rule.rx.lastIndex = 0;
            let m;
            while ((m = rule.rx.exec(segment)) !== null) {
              const start = m.index;
              const end = start + m[0].length;
              const overlaps = found.some((f) => !(end <= f.start || start >= f.end));
              if (!overlaps) {
                found.push({
                  start,
                  end,
                  text: m[1] || m[0],
                  rule
                });
              }
            }
          }
          // Mantém a ordem exata no texto e limita a 2 ou 3 lacunas no máximo para preservar o contexto
          found.sort((a, b) => a.start - b.start);
          return found.slice(0, 3);
        };

        const makeMultiCloze = (art, segment, matches) => {
          if (!matches.length) return null;

          // Substitui de trás para frente preservando 100% da literalidade original da lei
          let clozePrompt = segment;
          for (let i = matches.length - 1; i >= 0; i--) {
            const m = matches[i];
            clozePrompt = clozePrompt.slice(0, m.start) + `[ ${i + 1}. ______ ]` + clozePrompt.slice(m.end);
          }

          if (existingPrompts.has(clozePrompt.toLowerCase())) return null;

          const formatCombo = (vals) => vals.map((v, idx) => `${idx + 1}. ${v}`).join('  •  ');
          const correctVals = matches.map((m) => m.text);
          const correctStr = formatCombo(correctVals);

          // Monta 3 distratores combinando termos plausíveis da mesma categoria de cada lacuna
          const distractorSet = new Set([correctStr.toLowerCase()]);
          const opcoes = [correctStr];

          const pools = matches.map((m) =>
            m.rule.getDistractors(m.text).filter((d) => d.toLowerCase() !== m.text.toLowerCase())
          );

          let attempts = 0;
          while (opcoes.length < 4 && attempts < 40) {
            attempts++;
            const candidate = correctVals.map((val, idx) => {
              const pool = pools[idx];
              if (!pool.length) return val;
              // Troca ao menos 1 lacuna por tentativa
              if (matches.length === 1 || Math.random() < 0.65 || idx === (attempts % matches.length)) {
                return pool[Math.floor(Math.random() * pool.length)];
              }
              return val;
            });
            const candStr = formatCombo(candidate);
            if (!distractorSet.has(candStr.toLowerCase())) {
              distractorSet.add(candStr.toLowerCase());
              opcoes.push(candStr);
            }
          }

          if (opcoes.length < 4) return null;
          opcoes.sort(() => Math.random() - 0.5);
          existingPrompts.add(clozePrompt.toLowerCase());

          return {
            id: uid(`${trail.id}_q`),
            tipo: 'cloze',
            artigoRef: art.numero,
            enunciado: clozePrompt,
            opcoes,
            respostaCorreta: correctStr,
            gabaritoNumerado: correctStr,
            textoLiteral: this.applyOfflineMarks(art.rawText || ''),
            dicaVunesp: matches[0].rule.tip
          };
        };

        // Gera até 6 questões de lacunas estratégicas (máx. 2-3 lacunas por dispositivo, sem palavras triviais)
        for (const art of (trail.articles || [])) {
          const fullText = (art.rawText || '').trim();
          if (fullText.length < 25) continue;

          const segments = fullText
            .split('\n')
            .map((s) => s.replace(/\s+/g, ' ').trim())
            .filter((s) => s.length >= 25);

          let createdForArt = 0;
          for (const seg of segments) {
            if (qs.length >= 6 || createdForArt >= 2) break;
            const matches = extractStrategicMatches(seg);
            if (matches.length >= 1) {
              const q = makeMultiCloze(art, seg, matches);
              if (q) {
                qs.push(q);
                createdForArt++;
              }
            }
          }
        }

        return qs.slice(0, 6);
      },

      async callGemini(prompt) {
        const key = (localStorage.getItem(LS_KEYS.GEMINI_KEY) || '').trim();
        if (!key) throw new Error('Chave da API Gemini não configurada.');
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(key)}`;
        const resp = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }],
            generationConfig: { responseMimeType: 'application/json', temperature: 0.3 }
          })
        });
        if (!resp.ok) {
          const errTxt = await resp.text();
          throw new Error(`Gemini HTTP ${resp.status}: ${errTxt.slice(0, 120)}`);
        }
        const data = await resp.json();
        const raw = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
        const cleaned = raw.replace(/^```json\s*/i, '').replace(/```$/i, '').trim();
        return JSON.parse(cleaned);
      },

        const res = await this.callGemini(prompt);

    // =========================================================================
    // 8. PARSER HIERÁRQUICO DE LEI SECA (REGEX + DIVISÃO EM ATÉ 6 ARTIGOS)
    // =========================================================================
    const LawParser = {
      parse(rawText, disciplineId, splitSix = true) {
        const lines = String(rawText || '')
          .replace(/\r\n/g, '\n')
          .replace(/\r/g, '\n')
          .split('\n')
          .map((l) => l.trim())
          .filter((l) => l.length > 0);

        const headerRx = /^(LIVRO|T[ÍI]TULO|CAP[ÍI]TULO|SE[ÇC][ÃA]O|SUBSE[ÇC][ÃA]O)\b\s*(.*)$/i;
        const artRx = /^Art\.?\s*(\d+(?:\.\d+)?(?:[º°oª])?(?:\s*-\s*[A-Z])?)\.?\s*(.*)$/i;

        const hierarchy = { livro: '', titulo: '', capitulo: '', secao: '', subsecao: '' };
        const groups = [];
        let currentGroup = null;
        let currentArticle = null;
        let pendingHeaderKey = null;

        const buildBreadcrumb = () => {
          const parts = [hierarchy.livro, hierarchy.titulo, hierarchy.capitulo, hierarchy.secao, hierarchy.subsecao].filter(Boolean);
          return parts.length ? parts.join(' › ') : 'DISPOSIÇÕES GERAIS';
        };

        const buildGroupTitle = () => {
          return hierarchy.subsecao || hierarchy.secao || hierarchy.capitulo || hierarchy.titulo || hierarchy.livro || 'Disposições Gerais';
        };

        const flushArticle = () => {
          if (!currentArticle) return;
          if (!currentGroup) {
            currentGroup = { breadcrumb: buildBreadcrumb(), title: buildGroupTitle(), articles: [] };
            groups.push(currentGroup);
          }
          currentArticle.rawText = currentArticle.lines.join('\n').trim();
          currentArticle.textoHtml = VunespEngine.applyOfflineMarks(currentArticle.rawText);
          delete currentArticle.lines;
          currentGroup.articles.push(currentArticle);
          currentArticle = null;
        };

        for (let i = 0; i < lines.length; i++) {
          const line = lines[i];

          // 1. Início de Artigo
          const am = line.match(artRx);
          if (am) {
            pendingHeaderKey = null;
            flushArticle();
            if (!currentGroup) {
              currentGroup = { breadcrumb: buildBreadcrumb(), title: buildGroupTitle(), articles: [] };
              groups.push(currentGroup);
            }
            currentArticle = {
              numero: `Art. ${am[1].replace(/\s+/g, '')}`,
              lines: [line],
              notaPegadinha: ''
            };
            continue;
          }

          // 2. Cabeçalho estrutural (LIVRO, TÍTULO, CAPÍTULO, SEÇÃO, SUBSEÇÃO)
          const hm = line.match(headerRx);
          if (hm) {
            flushArticle();
            const type = hm[1].toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
            const fullHeader = line.replace(/\s+/g, ' ').trim();
            if (type === 'LIVRO') {
              hierarchy.livro = fullHeader;
              hierarchy.titulo = hierarchy.capitulo = hierarchy.secao = hierarchy.subsecao = '';
              pendingHeaderKey = 'livro';
            } else if (type === 'TITULO') {
              hierarchy.titulo = fullHeader;
              hierarchy.capitulo = hierarchy.secao = hierarchy.subsecao = '';
              pendingHeaderKey = 'titulo';
            } else if (type === 'CAPITULO') {
              hierarchy.capitulo = fullHeader;
              hierarchy.secao = hierarchy.subsecao = '';
              pendingHeaderKey = 'capitulo';
            } else if (type === 'SECAO') {
              hierarchy.secao = fullHeader;
              hierarchy.subsecao = '';
              pendingHeaderKey = 'secao';
            } else if (type === 'SUBSECAO') {
              hierarchy.subsecao = fullHeader;
              pendingHeaderKey = 'subsecao';
            }
            currentGroup = { breadcrumb: buildBreadcrumb(), title: buildGroupTitle(), articles: [] };
            groups.push(currentGroup);
            continue;
          }

          // 3. Linha descritiva imediatamente após um cabeçalho estrutural
          if (pendingHeaderKey && !currentArticle && line.length <= 140 && !/^(§|Parágrafo|I\s*-|II\s*-|a\))/i.test(line)) {
            hierarchy[pendingHeaderKey] = `${hierarchy[pendingHeaderKey]} — ${line}`;
            if (currentGroup) {
              currentGroup.breadcrumb = buildBreadcrumb();
              currentGroup.title = buildGroupTitle();
            }
            pendingHeaderKey = null;
            continue;
          }

          // 4. Continuação do artigo corrente (parágrafos, incisos, alíneas, penas)
          if (currentArticle) {
            currentArticle.lines.push(line);
          }
        }
        flushArticle();

        const validGroups = groups.filter((g) => g.articles.length > 0);
        const existingCount = (state.trails || []).filter((t) => t.disciplineId === disciplineId).length;
        const trails = [];
        let totalArticles = 0;

        validGroups.forEach((g) => {
          totalArticles += g.articles.length;
          const maxPerTrail = splitSix ? 6 : g.articles.length;
          const totalParts = Math.ceil(g.articles.length / maxPerTrail);

          for (let p = 0; p < totalParts; p++) {
            const chunk = g.articles.slice(p * maxPerTrail, (p + 1) * maxPerTrail);
            const firstArt = chunk[0].numero;
            const lastArt = chunk[chunk.length - 1].numero;
            const rangeLabel = chunk.length === 1 ? firstArt : `${firstArt} ao ${lastArt}`;
            const partSuffix = totalParts > 1 ? ` (Parte ${p + 1}/${totalParts})` : '';

            trails.push({
              id: uid(`tr_${disciplineId}`),
              disciplineId,
              order: existingCount + trails.length + 1,
              breadcrumb: g.breadcrumb,
              title: `${g.title}${partSuffix}`,
              subtitle: `${rangeLabel} • ${chunk.length} artigo${chunk.length === 1 ? '' : 's'}`,
              readingMin: chunk.length <= 4 ? 5 : 10,
              origemIa: false,
              selected: true,
              articles: chunk,
              questions: []
            });
          }
        });

        const mappedArticles = trails.reduce((sum, t) => sum + t.articles.length, 0);
        return { totalArticles, mappedArticles, trails };
      }
    };

    // =========================================================================
    // 9. MOTOR DE REVISÃO ESPAÇADA (SRS PONDERADO POR ALTA INCIDÊNCIA VUNESP)
    // =========================================================================
    const SRSEngine = {
      getIntervals(isHigh) {
        if (isHigh && state.settings.prioritizeHighIncidence) {
          return { hard: 1, good: 2, easy: 4, max: 14 };
        }
        return { hard: 1, good: 3, easy: 7, max: 60 };
      },

      enqueueTrail(trail) {
        if (!trail || !Array.isArray(trail.questions)) return;
        const tomorrow = todayISO(1);
        trail.questions.forEach((q) => {
          if (!state.srs[q.id]) {
            state.srs[q.id] = { due: tomorrow, interval: 1, ease: 2.5, reps: 0 };
          }
        });
      },

      schedule(questionId, rating, disciplineId = '', artigoRef = '') {
        const isHigh = isHighIncidenceArticle(disciplineId, artigoRef);
        const iv = this.getIntervals(isHigh);
        const cur = state.srs[questionId] || { due: todayISO(0), interval: 0, ease: 2.5, reps: 0 };

        let nextDays = 0;
        let reps = cur.reps || 0;
        let ease = cur.ease || 2.5;

        if (rating === 'again') {
          nextDays = 0;
          reps = 0;
          ease = Math.max(1.3, ease - 0.2);
        } else if (rating === 'hard') {
          nextDays = Math.min(iv.max, Math.max(iv.hard, Math.round((cur.interval || iv.hard) * 1.2)));
          reps++;
          ease = Math.max(1.3, ease - 0.1);
        } else if (rating === 'good') {
          nextDays = reps === 0 ? iv.good : Math.min(iv.max, Math.max(iv.good, Math.round((cur.interval || iv.good) * ease)));
          reps++;
        } else {
          nextDays = reps === 0 ? iv.easy : Math.min(iv.max, Math.max(iv.easy, Math.round((cur.interval || iv.easy) * ease * 1.3)));
          reps++;
          ease = Math.min(3.0, ease + 0.1);
        }

        state.srs[questionId] = {
          due: todayISO(nextDays),
          interval: nextDays,
          ease: Number(ease.toFixed(2)),
          reps
        };
        persistState(true);
      },

      getDueQuestions(onlyHigh = false) {
        const today = todayISO(0);
        const due = questionBankCache.filter((q) => {
          const rec = state.srs[q.id];
          if (!rec || rec.due > today) return false;
          if (onlyHigh && !isHighIncidenceQuestion(q)) return false;
          return true;
        });

        if (state.settings.prioritizeHighIncidence) {
          due.sort((a, b) => {
            const hiDiff = (isHighIncidenceQuestion(b) ? 1 : 0) - (isHighIncidenceQuestion(a) ? 1 : 0);
            if (hiDiff !== 0) return hiDiff;
            return (state.srs[a.id]?.due || '').localeCompare(state.srs[b.id]?.due || '');
          });
        }
        return due;
      }
    };

    // =========================================================================
    // 10. PLAYER DE ESTUDO (FASE 1 LEITURA ATIVA + FASE 2 QUIZ / SRS / ERROS)
    // =========================================================================
    const Player = {
      mode: 'read',
      trail: null,
      questions: [],
      qIndex: 0,
      hits: 0,
      answered: false,
      title: '',
      timerSec: 300,
      timerRunning: false,
      timerHandle: null,

      openTrailRead(trailId) {
        const t = state.trails.find((x) => x.id === trailId);
        if (!t) return;
        this.stopTimer();
        this.mode = 'read';
        this.trail = t;
        this.title = t.title;
        this.timerSec = (t.readingMin || 5) * 60;
        this.timerRunning = false;
        document.getElementById('player-overlay').classList.remove('hidden');
        this.renderRead();
      },

      openTrailQuiz(trailId) {
        const t = state.trails.find((x) => x.id === trailId);
        if (!t) return;
        if (!t.questions || !t.questions.length) {
          t.questions = VunespEngine.generateOfflineQuestions(t);
          persistState(true);
        }
        if (!t.questions.length) {
          showToast('Não foi possível gerar questões para esta trilha.', 'warn');
          return;
        }
        this.stopTimer();
        this.mode = 'trail_quiz';
        this.trail = t;
        this.title = `Quiz — ${t.title}`;
        this.questions = t.questions.map((q) => ({ ...q, trailId: t.id, disciplineId: t.disciplineId }));
        this.qIndex = 0;
        this.hits = 0;
        this.answered = false;
        document.getElementById('player-overlay').classList.remove('hidden');
        this.renderQuestion();
      },

      openQueue(mode, list, title) {
        if (!list || !list.length) {
          showToast('Nenhuma questão disponível nesta fila.', 'warn');
          return;
        }
        this.stopTimer();
        this.mode = mode;
        this.trail = null;
        this.title = title;
        this.questions = list;
        this.qIndex = 0;
        this.hits = 0;
        this.answered = false;
        document.getElementById('player-overlay').classList.remove('hidden');
        this.renderQuestion();
      },

      close() {
        this.stopTimer();
        document.getElementById('player-overlay').classList.add('hidden');
        App.render();
      },

      stopTimer() {
        if (this.timerHandle) clearInterval(this.timerHandle);
        this.timerHandle = null;
        this.timerRunning = false;
      },

      toggleTimer() {
        if (this.timerRunning) {
          this.stopTimer();
        } else {
          this.timerRunning = true;
          this.timerHandle = setInterval(() => {
            if (this.timerSec > 0) this.timerSec--;
            else {
              this.stopTimer();
              showToast('⏱️ Tempo de leitura encerrado! Hora do Quiz.', 'info');
            }
            this.updateTimerUI();
          }, 1000);
        }
        this.updateTimerUI();
      },

      formatTime(sec) {
        const m = String(Math.floor(sec / 60)).padStart(2, '0');
        const s = String(sec % 60).padStart(2, '0');
        return `${m}:${s}`;
      },

      updateTimerUI() {
        const btn = document.getElementById('read-timer-btn');
        if (btn) btn.textContent = `${this.timerRunning ? '⏸️' : '▶️'} ${this.formatTime(this.timerSec)}`;
      },

      toggleMarks() {
        state.settings.showMarks = !state.settings.showMarks;
        persistState(true);
        if (this.mode === 'read') this.renderRead();
      },

      changeFontSize(delta) {
        state.settings.fontSize = Math.min(24, Math.max(13, (state.settings.fontSize || 16) + delta));
        persistState(true);
        if (this.mode === 'read') this.renderRead();
      },

      formatArticleLines(htmlText) {
        return String(htmlText || '')
          .split('\n')
          .map((line) => line.trim())
          .filter(Boolean)
          .map((line) => {
            const plain = line.replace(/<[^>]+>/g, '').trim();
            if (/^([a-z]\)|[a-z]\s*-)/i.test(plain)) {
              return `<p class="pl-8 mb-1.5">${line}</p>`;
            }
            if (/^(M{0,3}(?:CM|CD|D?C{0,3})(?:XC|XL|L?X{0,3})(?:IX|IV|V?I{0,3}))\s*[-–—]/i.test(plain) && /^[IVXLCDM]+\s*[-–—]/.test(plain)) {
              return `<p class="pl-5 mb-1.5">${line}</p>`;
            }
            if (/^(§|Par[áa]grafo\s+[úu]nico)/i.test(plain)) {
              return `<p class="pl-3 mb-2">${line}</p>`;
            }
            return `<p class="mb-2">${line}</p>`;
          })
          .join('');
      },

      renderRead() {
        const t = this.trail;
        if (!t) return;
        const d = getDiscipline(t.disciplineId);
        const hideMarksCls = state.settings.showMarks ? '' : 'hide-marks';

        document.getElementById('player-header-info').innerHTML = `
          <p class="text-[10px] font-black uppercase tracking-wider text-indigo-600 dark:text-indigo-400 truncate">${escHtml(d.short)} • ${escHtml(t.breadcrumb || '')}</p>
          <h2 class="font-black text-sm sm:text-base truncate">Fase 1: ${escHtml(t.title)}</h2>
        `;

        document.getElementById('player-body').innerHTML = `
          <div class="max-w-3xl mx-auto space-y-4 animate-fade-in ${hideMarksCls}">

              <div class="flex flex-wrap items-center gap-1.5">
                <button id="read-timer-btn" onclick="Player.toggleTimer()" class="px-3 py-1.5 rounded-xl bg-indigo-600 text-white text-xs font-black">${this.timerRunning ? '⏸️' : '▶️'} ${this.formatTime(this.timerSec)}</button>
                <button onclick="Player.toggleMarks()" class="px-3 py-1.5 rounded-xl text-xs font-extrabold ${state.settings.showMarks ? 'bg-amber-100 dark:bg-amber-950/60 text-amber-800 dark:text-amber-300' : 'bg-slate-100 dark:bg-slate-800 text-slate-500'}">🖍️ Pegadinhas VUNESP</button>
                <button onclick="Player.changeFontSize(-1)" class="px-2.5 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-black">A-</button>
                <button onclick="Player.changeFontSize(1)" class="px-2.5 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-black">A+</button>
              </div>
              <div class="flex items-center gap-1.5">
                <button onclick="App.promptUpgradeAI('${t.id}', false)" class="px-3 py-1.5 rounded-xl bg-violet-100 dark:bg-violet-950/60 text-violet-700 dark:text-violet-300 text-xs font-extrabold">✨ Upgrade IA</button>
                <button onclick="App.promptUpgradeAI('${t.id}', true)" class="px-2.5 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-extrabold">+ Exercícios</button>
              </div>
            </div>

            <!-- Legenda cirúrgica 4 cores -->
            <div class="vunesp-legend bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-3 flex flex-wrap items-center gap-2 text-[11px] font-bold">
              <span class="text-slate-400 font-extrabold mr-1">Radar VUNESP:</span>
              <span class="px-2 py-0.5 rounded bg-rose-200/80 text-rose-900 dark:bg-rose-900/50 dark:text-rose-200">Exceção / Restrição</span>
              <span class="px-2 py-0.5 rounded bg-yellow-200/80 text-yellow-900 dark:bg-yellow-900/50 dark:text-yellow-200">Prazo / Número / Quórum</span>
              <span class="px-2 py-0.5 rounded bg-blue-200/80 text-blue-900 dark:bg-blue-900/50 dark:text-blue-200">Competência / Sujeito</span>
              <span class="px-2 py-0.5 rounded bg-purple-200/80 text-purple-900 dark:bg-purple-900/50 dark:text-purple-200">Conceito / Nuclear</span>
            </div>

            <!-- Cartões dos Artigos -->
            <div class="space-y-4">
              ${(t.articles || []).map((art) => {
                const isHigh = isHighIncidenceArticle(t.disciplineId, art.numero);
                return `
                  <article class="bg-white dark:bg-slate-900 rounded-3xl border ${isHigh ? 'border-orange-300 dark:border-orange-800/80' : 'border-slate-200 dark:border-slate-800'} p-5 shadow-sm space-y-3">
                    <div class="flex flex-wrap items-center justify-between gap-2">
                      <span class="px-3 py-1 rounded-xl bg-indigo-50 dark:bg-indigo-950/50 text-indigo-700 dark:text-indigo-300 text-xs font-black">${escHtml(art.numero)}</span>
                      ${isHigh ? '<span class="px-2.5 py-1 rounded-full bg-orange-100 dark:bg-orange-950/60 text-orange-700 dark:text-orange-300 text-[10px] font-black">🔥 Alta Incidência VUNESP</span>' : ''}
                    </div>
                    <div class="law-text leading-relaxed text-slate-800 dark:text-slate-200" style="font-size:${fontSize}px">
                      ${this.formatArticleLines(art.textoHtml || VunespEngine.applyOfflineMarks(art.rawText))}
                    </div>
                    ${art.notaPegadinha ? `<div class="pegadinha-note p-3 rounded-2xl bg-amber-50 dark:bg-amber-950/30 border border-amber-200 dark:border-amber-800/60 text-xs font-semibold text-amber-900 dark:text-amber-200">${escHtml(art.notaPegadinha)}</div>` : ''}
                  </article>
                `;
              }).join('')}
            </div>

            <button onclick="Player.openTrailQuiz('${t.id}')" class="w-full py-4 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-black text-sm shadow-lg transition">
              🎯 Ir para Fase 2: Quiz VUNESP (${(t.questions || []).length} questões) →
            </button>
          </div>
        `;
      },

      renderQuestion() {
        if (this.qIndex >= this.questions.length) {
          this.renderSummary();
          return;
        }
        this.answered = false;
        const q = this.questions[this.qIndex];
        const total = this.questions.length;
        const pct = Math.round((this.qIndex / total) * 100);
        const d = getDiscipline(q.disciplineId);
        const isHigh = isHighIncidenceQuestion(q);
        const tipoLabel = q.tipo === 'cloze' ? '🧩 Preenchimento de Lacuna' : q.tipo === 'true_false' ? '⚖️ Certo ou Errado' : '📝 Múltipla Escolha';

        document.getElementById('player-header-info').innerHTML = `
          <p class="text-[10px] font-black uppercase tracking-wider text-indigo-600 dark:text-indigo-400 truncate">${escHtml(this.title)}</p>
        const enunciadoHtml = escHtml(q.enunciado).replace(
          /\[\s*(?:(\d+)\.\s*)?_{3,}\s*\]|_{3,}/g,
          (_, num) => `<span class="inline-block px-2.5 py-0.5 mx-1 rounded-lg bg-indigo-100 dark:bg-indigo-950/80 text-indigo-700 dark:text-indigo-300 font-black border-b-2 border-indigo-500">[ ${num ? num + '. ' : ''}______ ]</span>`
        );

        let optionsHtml = '';
        if (q.tipo === 'true_false') {
          optionsHtml = `
            <div class="grid grid-cols-2 gap-3">
              <button onclick="Player.answer(true)" class="q-opt py-4 rounded-2xl border-2 border-slate-200 dark:border-slate-700 hover:border-emerald-500 bg-white dark:bg-slate-900 font-black text-sm transition">✅ CERTO</button>
              <button onclick="Player.answer(false)" class="q-opt py-4 rounded-2xl border-2 border-slate-200 dark:border-slate-700 hover:border-rose-500 bg-white dark:bg-slate-900 font-black text-sm transition">❌ ERRADO</button>
            </div>
          `;
        } else if (q.tipo === 'cloze') {
          optionsHtml = `
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
              ${(q.opcoes || []).map((opt, idx) => `
                <button onclick="Player.answer(Player.questions[Player.qIndex].opcoes[${idx}])" class="q-opt text-left p-3.5 rounded-2xl border-2 border-slate-200 dark:border-slate-700 hover:border-indigo-500 bg-white dark:bg-slate-900 text-xs sm:text-sm font-extrabold transition">
                  <span class="inline-flex w-6 h-6 rounded-lg bg-slate-100 dark:bg-slate-800 items-center justify-center mr-2 text-[11px] font-black">${String.fromCharCode(65 + idx)}</span>
                  ${escHtml(opt)}
                </button>
              `).join('')}
            </div>
          `;
        } else {
          optionsHtml = `
            <div class="space-y-2.5">
              ${(q.opcoes || []).map((opt, idx) => `
                <button onclick="Player.answer(${idx})" class="q-opt w-full text-left p-3.5 rounded-2xl border-2 border-slate-200 dark:border-slate-700 hover:border-indigo-500 bg-white dark:bg-slate-900 text-xs sm:text-sm font-bold transition flex items-start gap-2.5">
                  <span class="inline-flex w-6 h-6 rounded-lg bg-slate-100 dark:bg-slate-800 items-center justify-center shrink-0 text-[11px] font-black">${String.fromCharCode(65 + idx)}</span>
                  <span>${escHtml(opt)}</span>
                </button>
              `).join('')}
            </div>
          `;
        }

        document.getElementById('player-body').innerHTML = `
          <div class="max-w-2xl mx-auto space-y-4 animate-fade-in">
            <div class="h-2 bg-slate-200 dark:bg-slate-800 rounded-full overflow-hidden">
              <div class="h-full bg-indigo-600 transition-all" style="width:${pct}%"></div>
            </div>

            <div class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 p-5 sm:p-6 shadow-sm space-y-4">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <div class="flex flex-wrap items-center gap-1.5">
                  <span class="px-2.5 py-1 rounded-xl bg-slate-100 dark:bg-slate-800 text-[11px] font-extrabold">${escHtml(d.short)} • ${escHtml(q.artigoRef || '')}</span>
                  ${isHigh ? '<span class="px-2.5 py-1 rounded-full bg-orange-100 dark:bg-orange-950/60 text-orange-700 dark:text-orange-300 text-[10px] font-black">🔥 Alta Incidência VUNESP</span>' : ''}
                </div>
                <span class="text-[11px] font-extrabold text-indigo-600 dark:text-indigo-400">${tipoLabel}</span>
              </div>

              <p class="text-sm sm:text-base font-bold leading-relaxed">${enunciadoHtml}</p>
              ${optionsHtml}
            </div>

            <div id="q-feedback"></div>
          </div>
        `;
      },

      findFullArticle(q) {
        if (!q) return null;
        const targetNum = normalizeArticleNum(q.artigoRef);
        if (!targetNum) return null;

        // 1. Busca prioritária na trilha de origem da questão
        const originTrail = (state.trails || []).find((t) => t.id === q.trailId);
        if (originTrail && Array.isArray(originTrail.articles)) {
          const found = originTrail.articles.find((a) => normalizeArticleNum(a.numero) === targetNum);
          if (found) return found;
        }

        // 2. Busca nas demais trilhas da mesma disciplina
        for (const t of (state.trails || [])) {
          if (q.disciplineId && t.disciplineId !== q.disciplineId) continue;
          const found = (t.articles || []).find((a) => normalizeArticleNum(a.numero) === targetNum);
          if (found) return found;
        }
        return null;
      },

      answer(choice) {
        if (this.answered) return;
        this.answered = true;
        const q = this.questions[this.qIndex];
        const correct = q.tipo === 'cloze'
          ? String(choice).trim().toLowerCase() === String(q.respostaCorreta).trim().toLowerCase()
          : choice === q.respostaCorreta;

        if (correct) {
          this.hits++;
          this.addXP(10);
          if (this.mode === 'errors') {
            state.errors = state.errors.filter((id) => id !== q.id);
          }
        } else {
          if (!state.errors.includes(q.id)) state.errors.push(q.id);
        }
        persistState(true);

        document.querySelectorAll('.q-opt').forEach((b) => { b.disabled = true; b.classList.add('opacity-60'); });

        const isHigh = isHighIncidenceQuestion(q);
        const iv = SRSEngine.getIntervals(isHigh);
        const fullArt = this.findFullArticle(q);
        const hideMarksCls = state.settings.showMarks ? '' : 'hide-marks';

        const fullArticleHtml = fullArt
          ? `
            <div class="space-y-2 ${hideMarksCls}">
              <div class="flex items-center justify-between gap-2">
                <span class="text-[11px] font-black uppercase tracking-wider text-indigo-700 dark:text-indigo-300">📖 Artigo Completo — ${escHtml(fullArt.numero)}</span>
                <span class="text-[10px] font-bold text-slate-400">Texto integral na revisão</span>
              </div>
              <div class="law-text text-xs sm:text-sm bg-white/90 dark:bg-slate-900/90 p-4 rounded-2xl border border-slate-200/80 dark:border-slate-700 leading-relaxed max-h-96 overflow-y-auto">
                ${this.formatArticleLines(fullArt.textoHtml || VunespEngine.applyOfflineMarks(fullArt.rawText))}
              </div>
              ${fullArt.notaPegadinha ? `<div class="pegadinha-note p-3 rounded-xl bg-amber-50 dark:bg-amber-950/30 border border-amber-200 dark:border-amber-800/60 text-xs font-semibold text-amber-900 dark:text-amber-200">${escHtml(fullArt.notaPegadinha)}</div>` : ''}
            </div>
          `
          : `
            <div class="law-text text-xs sm:text-sm bg-white/80 dark:bg-slate-900/80 p-3.5 rounded-2xl border border-slate-200/70 dark:border-slate-700 leading-relaxed">
              ${q.textoLiteral || ''}
            </div>
          `;

        const srsBar = this.mode === 'srs' ? `
          <div class="pt-3 border-t border-slate-200 dark:border-slate-800">
            <p class="text-[11px] font-extrabold text-slate-500 mb-2">Agendar próxima revisão ${isHigh && state.settings.prioritizeHighIncidence ? '(🔥 Ciclo Curto — Alta Incidência)' : '(Ciclo Padrão)'}:</p>
            <div class="grid grid-cols-4 gap-2">
              <button onclick="Player.rateSRS('again')" class="py-2 rounded-xl bg-rose-100 dark:bg-rose-950/60 text-rose-700 dark:text-rose-300 text-xs font-black">Errei<br><span class="text-[10px] font-semibold">Hoje</span></button>
              <button onclick="Player.rateSRS('hard')" class="py-2 rounded-xl bg-amber-100 dark:bg-amber-950/60 text-amber-800 dark:text-amber-300 text-xs font-black">Difícil<br><span class="text-[10px] font-semibold">${iv.hard}d</span></button>
              <button onclick="Player.rateSRS('good')" class="py-2 rounded-xl bg-emerald-100 dark:bg-emerald-950/60 text-emerald-800 dark:text-emerald-300 text-xs font-black">Bom<br><span class="text-[10px] font-semibold">${iv.good}d</span></button>
              <button onclick="Player.rateSRS('easy')" class="py-2 rounded-xl bg-sky-100 dark:bg-sky-950/60 text-sky-800 dark:text-sky-300 text-xs font-black">Fácil<br><span class="text-[10px] font-semibold">${iv.easy}d</span></button>
            </div>
          </div>
        ` : `
          <button onclick="Player.next()" class="w-full py-3 rounded-2xl bg-indigo-600 text-white font-black text-sm">Continuar →</button>
        `;

        document.getElementById('q-feedback').innerHTML = `
          <div class="rounded-3xl border p-5 space-y-3 animate-fade-in ${correct ? 'bg-emerald-50 dark:bg-emerald-950/30 border-emerald-300 dark:border-emerald-800' : 'bg-rose-50 dark:bg-rose-950/30 border-rose-300 dark:border-rose-800'}">
            <p class="font-black text-sm ${correct ? 'text-emerald-700 dark:text-emerald-300' : 'text-rose-700 dark:text-rose-300'}">
              ${correct ? '✅ Mandou bem! (+10 XP)' : '❌ Pegadinha! Enviada ao Caderno de Erros'}
            </p>
            ${q.tipo === 'cloze' ? `
              <div class="p-3 rounded-2xl bg-indigo-50 dark:bg-indigo-950/40 border border-indigo-200 dark:border-indigo-800/60 text-xs">
                <span class="font-black text-indigo-700 dark:text-indigo-300">🔑 Gabarito das Lacunas:</span>
                <span class="font-extrabold text-slate-800 dark:text-slate-100 ml-1">${escHtml(q.gabaritoNumerado || q.respostaCorreta)}</span>
              </div>
            ` : ''}
            ${fullArticleHtml}
            ${q.dicaVunesp ? `<p class="text-xs font-bold text-amber-800 dark:text-amber-300">💡 Dica VUNESP: ${escHtml(q.dicaVunesp)}</p>` : ''}
            ${srsBar}
          </div>
        `;
      },

      rateSRS(rating) {
        const q = this.questions[this.qIndex];
        SRSEngine.schedule(q.id, rating, q.disciplineId, q.artigoRef);
        this.next();
      },

      next() {
        this.qIndex++;
        this.renderQuestion();
      },

      addXP(amount) {
        const today = todayISO(0);
        state.stats.xp = (state.stats.xp || 0) + amount;
        if (state.stats.todayDate !== today) {
          state.stats.todayDate = today;
          state.stats.todayCount = 0;
        }
        state.stats.todayCount++;
        if (state.stats.lastStudyDate !== today) {
          const yesterday = todayISO(-1);
          state.stats.streak = state.stats.lastStudyDate === yesterday ? (state.stats.streak || 0) + 1 : 1;
          state.stats.lastStudyDate = today;
        }
      },

      renderSummary() {
        const total = this.questions.length;
        const pct = total ? Math.round((this.hits / total) * 100) : 0;
        let masteredNow = false;

        if (this.mode === 'trail_quiz' && this.trail?.id) {
          const prev = state.progress[this.trail.id] || { mastered: false, bestScore: 0 };
          const mastered = prev.mastered || pct === 100;
          masteredNow = pct === 100;
          state.progress[this.trail.id] = { mastered, bestScore: Math.max(prev.bestScore || 0, pct), updatedAt: todayISO(0) };
          if (masteredNow) {
            this.addXP(50);
            SRSEngine.enqueueTrail(this.trail);
          }
          persistState(true);
        }

        document.getElementById('player-body').innerHTML = `
          <div class="max-w-md mx-auto text-center bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 p-6 space-y-4 shadow-sm animate-fade-in">
            <div class="text-5xl">${pct === 100 ? '🏆' : pct >= 70 ? '💪' : '📚'}</div>
            <h2 class="font-black text-2xl">${pct}% de Acerto</h2>
            <p class="text-xs font-bold text-slate-500">${this.hits} de ${total} questões corretas</p>
            ${this.mode === 'trail_quiz' ? (
              masteredNow
                ? '<div class="p-3 rounded-2xl bg-emerald-50 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-300 text-xs font-extrabold">✅ Trilha 100% Dominada! Próxima etapa desbloqueada e artigos enviados para a fila SRS (+50 XP).</div>'
                : '<div class="p-3 rounded-2xl bg-amber-50 dark:bg-amber-950/40 text-amber-800 dark:text-amber-300 text-xs font-extrabold">🔒 Regra de Ouro: você precisa de 100% de acerto para destravar a próxima trilha.</div>'
            ) : ''}
            <div class="flex flex-col gap-2 pt-2">
              ${this.mode === 'trail_quiz' && !masteredNow ? `<button onclick="Player.openTrailQuiz('${this.trail.id}')" class="w-full py-3 rounded-2xl bg-indigo-600 text-white text-xs font-black">🔄 Tentar Novamente</button>` : ''}
              ${this.mode === 'trail_quiz' ? `<button onclick="App.promptUpgradeAI('${this.trail.id}', true)" class="w-full py-2.5 rounded-2xl bg-violet-100 dark:bg-violet-950/60 text-violet-700 dark:text-violet-300 text-xs font-extrabold">✨ Gerar + Exercícios desta Trilha</button>` : ''}
              <button onclick="Player.close()" class="w-full py-3 rounded-2xl bg-slate-100 dark:bg-slate-800 text-xs font-extrabold">Voltar ao Painel</button>
            </div>
          </div>
        `;
      }
    };

    // =========================================================================
    // 11. CONTROLADOR PRINCIPAL (5 ABAS)
    // =========================================================================
    const App = {
      tab: 'trilhas',
      selectedDiscId: null,
      revSubTab: 'due',
      bankFilterDisc: 'all',
      bankOnlyHigh: false,
      importDraft: null,
      importDestDisc: 'cf88',
      importSplitSix: true,

      async init() {
        // Tema & Viewport
        if (localStorage.getItem(LS_KEYS.THEME) === 'dark') document.documentElement.classList.add('dark');
        this.setViewportMode(localStorage.getItem(LS_KEYS.VIEWPORT) || 'auto', false);

        await loadLocalState();
        initFirebase();
        updateAuthBadges();
        this.render();
      },

      toggleTheme() {
        const isDark = document.documentElement.classList.toggle('dark');
        localStorage.setItem(LS_KEYS.THEME, isDark ? 'dark' : 'light');
      },

      setViewportMode(mode, save = true) {
        document.body.classList.remove('force-mobile', 'force-desktop');
        if (mode === 'mobile') document.body.classList.add('force-mobile');
        if (mode === 'desktop') document.body.classList.add('force-desktop');
        if (save) localStorage.setItem(LS_KEYS.VIEWPORT, mode);
        document.querySelectorAll('.js-viewport-select').forEach((el) => (el.value = mode));
      },

      setTab(tab) {
        this.tab = tab;
        this.render();
      },

      updateTopMetrics() {
        document.querySelectorAll('.js-streak').forEach((el) => (el.textContent = state.stats.streak || 0));
        document.querySelectorAll('.js-xp').forEach((el) => (el.textContent = state.stats.xp || 0));
        const dueCount = SRSEngine.getDueQuestions(false).length;
        document.querySelectorAll('.js-due-badge').forEach((el) => {
          el.textContent = dueCount;
          el.classList.toggle('hidden', dueCount === 0);
        });
        const errCount = (state.errors || []).length;
        document.querySelectorAll('.js-err-badge').forEach((el) => {
          el.textContent = errCount;
          el.classList.toggle('hidden', errCount === 0);
        });

        document.querySelectorAll('.nav-btn').forEach((b) => {
          const active = b.dataset.tab === this.tab;
          b.className = `nav-btn w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-xs font-extrabold transition ${active ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'}`;
        });
        document.querySelectorAll('.nav-btn-mob').forEach((b) => {
          const active = b.dataset.tab === this.tab;
          b.className = `nav-btn-mob relative flex flex-col items-center gap-0.5 px-2 py-1 rounded-xl text-[10px] font-extrabold ${active ? 'text-indigo-600 dark:text-indigo-400' : 'text-slate-500'}`;
        });
      },

      render() {
        this.updateTopMetrics();
        const root = document.getElementById('view-root');
        if (this.tab === 'trilhas') root.innerHTML = this.viewTrilhas();
        else if (this.tab === 'revisoes') root.innerHTML = this.viewRevisoes();
        else if (this.tab === 'importar') { root.innerHTML = this.viewImportar(); this.bindDropzone(); }
        else if (this.tab === 'erros') root.innerHTML = this.viewErros();
        else root.innerHTML = this.viewAjustes();
      },

      // --- ABA 1: TRILHAS ---
      viewTrilhas() {
        const discs = getAllDisciplines();
        if (this.selectedDiscId) return this.viewDisciplineTrails(this.selectedDiscId);

        const totalTrails = state.trails.length;
        const mastered = state.trails.filter((t) => state.progress[t.id]?.mastered).length;
        const pct = totalTrails ? Math.round((mastered / totalTrails) * 100) : 0;

        return `
          <div class="space-y-5 animate-fade-in">
            <div class="bg-gradient-to-br from-indigo-600 to-blue-700 text-white rounded-3xl p-5 shadow-md flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div>
                <p class="text-[11px] font-bold uppercase tracking-wider text-indigo-200">Edital Escrevente TJSP • ${TOTAL_HIGH_INCIDENCE_COUNT} artigos de Alta Incidência mapeados</p>
                <h2 class="font-black text-xl sm:text-2xl mt-0.5">Suas Trilhas da Lei Seca</h2>
                <p class="text-xs text-indigo-100 mt-1">${mastered} de ${totalTrails} trilhas dominadas (${pct}%) • Portão dos 100% ativo</p>
              </div>
              <div class="flex gap-2">
                <button onclick="App.openNewDisciplineModal()" class="px-3.5 py-2.5 rounded-2xl bg-white/15 hover:bg-white/25 text-xs font-extrabold backdrop-blur">+ Nova Lei</button>
                <button onclick="App.setTab('importar')" class="px-4 py-2.5 rounded-2xl bg-white text-indigo-700 text-xs font-black shadow">📥 Importar DOCX</button>
              </div>
            </div>

            <div class="responsive-grid-3 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3.5">
              ${discs.map((d) => {
                const list = state.trails.filter((t) => t.disciplineId === d.id);
                const done = list.filter((t) => state.progress[t.id]?.mastered).length;
                const p = list.length ? Math.round((done / list.length) * 100) : 0;
                const isCustom = (state.customDisciplines || []).some((c) => c.id === d.id);
                return `
                  <div onclick="App.openDiscipline('${d.id}')" class="cursor-pointer bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 hover:border-indigo-400 p-4 transition shadow-sm flex flex-col justify-between gap-3">
                    <div class="flex items-start justify-between gap-2">
                      <div class="flex items-center gap-2.5 min-w-0">
                        <span class="w-9 h-9 rounded-xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-lg shrink-0">${d.icon || '📄'}</span>
                        <div class="min-w-0">
                          <h3 class="font-black text-sm truncate">${escHtml(d.short)}</h3>
                          <p class="text-[11px] text-slate-400 line-clamp-1">${escHtml(d.name)}</p>
                        </div>
                      </div>
                      ${isCustom && list.length === 0 ? `<button onclick="event.stopPropagation(); App.deleteCustomDiscipline('${d.id}')" class="text-rose-500 text-xs font-bold px-1.5">🗑️</button>` : ''}
                    </div>
                    <div>
                      <div class="flex justify-between text-[11px] font-extrabold mb-1">
                        <span class="text-slate-500">${list.length} trilha${list.length === 1 ? '' : 's'}</span>
                        <span class="text-indigo-600 dark:text-indigo-400">${done}/${list.length} (${p}%)</span>
                      </div>
                      <div class="h-1.5 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden">
                        <div class="h-full bg-indigo-600" style="width:${p}%"></div>
                      </div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      },

      openDiscipline(id) { this.selectedDiscId = id; this.render(); },

      viewDisciplineTrails(discId) {
        const d = getDiscipline(discId);
        const list = state.trails.filter((t) => t.disciplineId === discId).sort((a, b) => (a.order || 0) - (b.order || 0));

        return `
          <div class="space-y-4 animate-fade-in">
            <div class="flex flex-wrap items-center justify-between gap-3">
              <button onclick="App.selectedDiscId=null; App.render();" class="px-3 py-1.5 rounded-xl bg-slate-200 dark:bg-slate-800 text-xs font-extrabold">← Todas as Leis</button>
              <button onclick="App.importDestDisc='${discId}'; App.setTab('importar');" class="px-3.5 py-2 rounded-xl bg-indigo-600 text-white text-xs font-extrabold">📥 Importar DOCX nesta Lei</button>
            </div>

            <div class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 p-4 sm:p-5">
              <h2 class="font-black text-lg">${d.icon || '📄'} ${escHtml(d.short)}</h2>
              <p class="text-xs text-slate-500 mt-0.5">${escHtml(d.name)}</p>
            </div>

            ${list.length === 0 ? `
              <div class="bg-white dark:bg-slate-900 rounded-3xl border border-dashed border-slate-300 dark:border-slate-700 p-8 text-center space-y-3">
                <p class="text-sm font-bold text-slate-500">Nenhuma trilha cadastrada nesta legislação ainda.</p>
                <button onclick="App.importDestDisc='${discId}'; App.setTab('importar');" class="px-4 py-2.5 rounded-xl bg-indigo-600 text-white text-xs font-extrabold">📥 Subir arquivo .docx agora</button>
              </div>
            ` : `
              <div class="responsive-grid-2 grid grid-cols-1 lg:grid-cols-2 gap-3.5">
                ${list.map((t, idx) => {
                  const prog = state.progress[t.id] || { mastered: false, bestScore: 0 };
                  const unlocked = idx === 0 || !!state.progress[list[idx - 1].id]?.mastered;
                  const hiCount = countHighIncidenceInTrail(t);
                  return `
                    <div class="bg-white dark:bg-slate-900 rounded-2xl border ${prog.mastered ? 'border-emerald-300 dark:border-emerald-800' : unlocked ? 'border-slate-200 dark:border-slate-800' : 'border-slate-200/60 dark:border-slate-800/60 opacity-70'} p-4 shadow-sm flex flex-col justify-between gap-3">
                      <div>
                        <div class="flex flex-wrap items-center justify-between gap-1.5 mb-1.5">
                          <span class="text-[10px] font-black uppercase tracking-wider text-indigo-600 dark:text-indigo-400">Etapa ${idx + 1} • ${escHtml(t.breadcrumb || '')}</span>
                          <div class="flex items-center gap-1">
                            ${hiCount > 0 ? `<span class="px-2 py-0.5 rounded-full bg-orange-100 dark:bg-orange-950/60 text-orange-700 dark:text-orange-300 text-[10px] font-black">🔥 ${hiCount}/${t.articles.length} Alta Inc.</span>` : ''}
                            <span class="px-2 py-0.5 rounded-full text-[10px] font-black ${t.origemIa ? 'bg-violet-100 dark:bg-violet-950/60 text-violet-700 dark:text-violet-300' : 'bg-slate-100 dark:bg-slate-800 text-slate-500'}">${t.origemIa ? '✨ IA VUNESP' : '⚡ Offline'}</span>
                          </div>
                        </div>
                        <h3 class="font-black text-sm sm:text-base">${escHtml(t.title)}</h3>
                        <p class="text-xs text-slate-500 mt-0.5">${escHtml(t.subtitle)} • ⏱️ ${t.readingMin || 5} min • ${(t.questions || []).length} questões</p>
                      </div>

                      <div class="flex flex-wrap items-center gap-2 pt-2 border-t border-slate-100 dark:border-slate-800">
                        ${unlocked ? `
                          <button onclick="Player.openTrailRead('${t.id}')" class="flex-1 py-2 rounded-xl bg-indigo-600 text-white text-xs font-extrabold">${prog.mastered ? '✅ Revisar Trilha' : '📖 Ler & Jogar'}</button>
                          <button onclick="App.promptUpgradeAI('${t.id}', false)" class="px-2.5 py-2 rounded-xl bg-violet-100 dark:bg-violet-950/60 text-violet-700 dark:text-violet-300 text-[11px] font-extrabold" title="Upgrade cirúrgico com IA">✨ IA</button>
                          <button onclick="App.promptUpgradeAI('${t.id}', true)" class="px-2.5 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-[11px] font-extrabold" title="Gerar mais questões">+Q</button>
                        ` : `
                          <span class="w-full py-2 text-center rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-500 text-xs font-extrabold">🔒 Conclua a Etapa ${idx} com 100% para destravar</span>
                        `}
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            `}
          </div>
        `;
      },

      // --- ABA 2: REVISÕES & BANCO DE QUESTÕES ---
      viewRevisoes() {
        const dueAll = SRSEngine.getDueQuestions(false);
        const dueHigh = SRSEngine.getDueQuestions(true);
        const discs = getAllDisciplines();
        const filteredBank = questionBankCache.filter((q) => {
          if (this.bankFilterDisc !== 'all' && q.disciplineId !== this.bankFilterDisc) return false;
          if (this.bankOnlyHigh && !isHighIncidenceQuestion(q)) return false;
          return true;
        });

        return `
          <div class="space-y-5 animate-fade-in">
            <div class="flex gap-2 bg-white dark:bg-slate-900 p-1.5 rounded-2xl border border-slate-200 dark:border-slate-800 w-fit">
              <button onclick="App.revSubTab='due'; App.render();" class="px-4 py-2 rounded-xl text-xs font-extrabold ${this.revSubTab === 'due' ? 'bg-indigo-600 text-white' : 'text-slate-500'}">🔄 Revisões Hoje (${dueAll.length})</button>
              <button onclick="App.revSubTab='bank'; App.render();" class="px-4 py-2 rounded-xl text-xs font-extrabold ${this.revSubTab === 'bank' ? 'bg-indigo-600 text-white' : 'text-slate-500'}">📚 Banco de Questões (${questionBankCache.length})</button>
            </div>

            ${this.revSubTab === 'due' ? `
              <div class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 p-6 space-y-4">
                <div class="flex flex-wrap items-center justify-between gap-3">
                  <div>
                    <h2 class="font-black text-lg">Fila SRS de Hoje (${todayISO(0)})</h2>
                    <p class="text-xs text-slate-500">Artigos de <strong>🔥 Alta Incidência</strong> ficam no topo com ciclos mais curtos (1d / 2d / 4d, máx. 14d).</p>
                  </div>
                  <div class="flex gap-2">
                    <button onclick="App.startSRS(true)" class="px-3.5 py-2.5 rounded-xl bg-orange-500 text-white text-xs font-black ${dueHigh.length ? '' : 'opacity-40'}" ${dueHigh.length ? '' : 'disabled'}>🔥 Só Alta Incidência (${dueHigh.length})</button>
                    <button onclick="App.startSRS(false)" class="px-4 py-2.5 rounded-xl bg-indigo-600 text-white text-xs font-black ${dueAll.length ? '' : 'opacity-40'}" ${dueAll.length ? '' : 'disabled'}>▶ Revisar Tudo (${dueAll.length})</button>
                  </div>
                </div>
                ${dueAll.length === 0 ? '<p class="text-xs font-bold text-emerald-600 py-4">🎉 Nenhuma revisão vencida hoje! Domine novas trilhas ou use o Simulador de Data em Ajustes.</p>' : `
                  <div class="space-y-2 max-h-80 overflow-y-auto">
                    ${dueAll.slice(0, 20).map((q) => `
                      <div class="p-3 rounded-xl bg-slate-50 dark:bg-slate-800/70 flex items-center justify-between gap-2 text-xs">
                        <div class="min-w-0">
                          <span class="font-black">${escHtml(q.artigoRef)}</span>
                          ${isHighIncidenceQuestion(q) ? '<span class="ml-1 text-orange-600 font-black">🔥</span>' : ''}
                          <span class="text-slate-500 ml-1 truncate">${escHtml(q.enunciado.slice(0, 80))}...</span>
                        </div>
                        <span class="text-[10px] font-bold text-slate-400 shrink-0">${escHtml(getDiscipline(q.disciplineId).short)}</span>
                      </div>
                    `).join('')}
                  </div>
                `}
              </div>
            ` : `
              <div class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 p-5 space-y-4">
                <div class="flex flex-wrap items-center justify-between gap-2">
                  <div class="flex flex-wrap items-center gap-2">
                    <select onchange="App.bankFilterDisc=this.value; App.render();" class="px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-bold">
                      <option value="all">Todas as Disciplinas</option>
                      ${discs.map((d) => `<option value="${d.id}" ${this.bankFilterDisc === d.id ? 'selected' : ''}>${escHtml(d.short)}</option>`).join('')}
                    </select>
                    <button onclick="App.bankOnlyHigh=!App.bankOnlyHigh; App.render();" class="px-3 py-2 rounded-xl text-xs font-extrabold ${this.bankOnlyHigh ? 'bg-orange-500 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'}">🔥 Só Alta Incidência</button>
                  </div>
                  <button onclick="App.startSimulado()" class="px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-black">🎯 Simulado Rápido (até 10q)</button>
                </div>
                <p class="text-xs font-bold text-slate-500">${filteredBank.length} questões encontradas</p>
                <div class="space-y-2 max-h-96 overflow-y-auto">
                  ${filteredBank.slice(0, 30).map((q) => `
                    <div class="p-3 rounded-xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200/60 dark:border-slate-700/60 text-xs">
                      <div class="flex items-center justify-between gap-2 mb-1">
                        <span class="font-black text-indigo-600 dark:text-indigo-400">${escHtml(getDiscipline(q.disciplineId).short)} • ${escHtml(q.artigoRef)} ${isHighIncidenceQuestion(q) ? '🔥' : ''}</span>
                        <span class="text-[10px] uppercase font-bold text-slate-400">${escHtml(q.tipo)}</span>
                      </div>
                      <p class="font-semibold">${escHtml(q.enunciado)}</p>
                    </div>
                  `).join('')}
                </div>
              </div>
            `}
          </div>
        `;
      },

      startSRS(onlyHigh) {
        const list = SRSEngine.getDueQuestions(onlyHigh);
        Player.openQueue('srs', list, onlyHigh ? '🔥 Revisão Expressa — Alta Incidência' : '🔄 Revisões SRS de Hoje');
      },

      startSimulado() {
        let pool = questionBankCache.filter((q) => {
          if (this.bankFilterDisc !== 'all' && q.disciplineId !== this.bankFilterDisc) return false;
          if (this.bankOnlyHigh && !isHighIncidenceQuestion(q)) return false;
          return true;
        });
        if (!pool.length) { showToast('Sem questões no filtro selecionado.', 'warn'); return; }

        // Prioriza até 70% de questões de Alta Incidência quando o modo inteligente está ligado
        if (state.settings.prioritizeHighIncidence && !this.bankOnlyHigh) {
          const hi = pool.filter((q) => isHighIncidenceQuestion(q)).sort(() => Math.random() - 0.5);
          const lo = pool.filter((q) => !isHighIncidenceQuestion(q)).sort(() => Math.random() - 0.5);
          const pickHi = hi.slice(0, 7);
          const pickLo = lo.slice(0, 10 - pickHi.length);
          pool = [...pickHi, ...pickLo, ...hi.slice(7)].slice(0, 10).sort(() => Math.random() - 0.5);
        } else {
          pool = pool.sort(() => Math.random() - 0.5).slice(0, 10);
        }
        Player.openQueue('simulado', pool, '🎯 Simulado Rápido VUNESP');
      },
